<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D body prototype</title>
<style>
  body{margin:0;background:#0b1411;color:#e7f0ea;font-family:-apple-system,system-ui,sans-serif}
  .bar{padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #21362b}
  button{padding:7px 12px;border:1px solid #21362b;background:#121f1a;color:#9fb3a6;border-radius:8px;cursor:pointer;font-size:13px}
  button:hover{border-color:#2bb673;color:#e7f0ea}
  button.on{background:#39d98a;color:#06241a;border-color:#39d98a;font-weight:600}
  canvas{display:block;width:100%;cursor:grab}
  .hint{color:#7d9488;font-size:12px}
  input[type=range]{width:240px}
  .sp{margin-left:auto}
</style></head>
<body>
<div class="bar">
  <button id="p-face" class="on">Face-on</button>
  <button id="p-dtl">Down-the-line</button>
  <button id="p-top">Overhead</button>
  <span style="width:14px"></span>
  <button id="s-trad" class="on">Traditional</button>
  <button id="s-ven">Venetos</button>
  <span class="sp"></span>
  <button id="play">▶ Play</button>
  <input type="range" id="ph" min="0" max="1" step="0.005" value="0.12">
  <span class="hint" id="lbl">Address</span>
</div>
<canvas id="c" height="560"></canvas>
<script>
const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}), add=(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z});
const scl=(a,s)=>({x:a.x*s,y:a.y*s,z:a.z*s}), dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross=(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x});
const len=a=>Math.hypot(a.x,a.y,a.z), norm=a=>{const l=len(a)||1;return scl(a,1/l);}, V=(x,y,z)=>({x,y,z});
const D2R=Math.PI/180, mid=(a,b)=>scl(add(a,b),0.5), smooth=u=>u*u*(3-2*u);
const rotY=(p,a)=>{const c=Math.cos(a),s=Math.sin(a);return V(p.x*c+p.z*s,p.y,-p.x*s+p.z*c);};
// spherical interpolation of unit vectors (rotates instead of cutting a straight chord)
function slerp(a,b,t){let d=dot(a,b);d=Math.max(-1,Math.min(1,d));const th=Math.acos(d);if(th<1e-3)return a;const s=Math.sin(th);return norm(add(scl(a,Math.sin((1-t)*th)/s),scl(b,Math.sin(t*th)/s)));}
// rotate vector v around unit axis by angle (Rodrigues)
function rod(v,axis,ang){const a=norm(axis),c=Math.cos(ang),s=Math.sin(ang),d=dot(a,v);
  return add(add(scl(v,c),scl(cross(a,v),s)),scl(a,d*(1-c)));}
// 2-bone IK: place the elbow between shoulder S and wrist G; `pole` sets the bend direction
function ik2(S,G,L1,L2,pole){
  const SG=sub(G,S); let d=len(SG); d=Math.max(1e-4,Math.min(d,L1+L2-1e-3)); const dir=scl(SG,1/len(SG)||0);
  let a=(d*d+L1*L1-L2*L2)/(2*d); a=Math.max(-L1,Math.min(L1,a));
  const h=Math.sqrt(Math.max(0,L1*L1-a*a)), base=add(S,scl(dir,a));
  let perp=sub(pole,scl(dir,dot(pole,dir))); if(len(perp)<1e-5)perp=sub(V(0,-1,0),scl(dir,dot(V(0,-1,0),dir)));
  return add(base,scl(norm(perp),h));
}
function sched(p,k){if(p<=k[0][0])return k[0][1];for(let i=1;i<k.length;i++){if(p<=k[i][0]){const u=(p-k[i-1][0])/(k[i][0]-k[i-1][0]);return k[i-1][1]+(k[i][1]-k[i-1][1])*u;}}return k[k.length-1][1];}

const cam={az:0, el:0.05, dist:2.9, T:V(0,0.95,0.06), f:0};
function project(p,W,H){
  const camDir=V(Math.sin(cam.az)*Math.cos(cam.el),Math.sin(cam.el),Math.cos(cam.az)*Math.cos(cam.el));
  const C=add(cam.T,scl(camDir,cam.dist)), fwd=norm(sub(cam.T,C));
  const right=norm(cross(fwd,V(0,1,0))), up=cross(right,fwd), rel=sub(p,C);
  const d=Math.max(0.05,dot(rel,fwd));
  return {x:W/2+cam.f*dot(rel,right)/d, y:H/2-cam.f*dot(rel,up)/d, z:d, s:cam.f/d};
}

// ===== parametrised swing pose =====
let style="trad", phase=0.12;
function poseAt(ph){
  const ven=style==="ven";
  const spineTilt=sched(ph,[[.12,42],[.45,40],[.60,42],[1,15]])*D2R;
  const hipT=sched(ph, ven?[[.12,0],[.45,-6],[.60,16],[1,52]]:[[.12,0],[.45,-45],[.60,42],[1,86]])*D2R;
  const shoT=sched(ph, ven?[[.12,0],[.45,-24],[.60,-2],[1,44]]:[[.12,0],[.45,-92],[.60,-14],[1,82]])*D2R;
  const sway=ven?sched(ph,[[.12,.02],[.60,.03],[1,.05]]):sched(ph,[[.12,0],[.3,-.05],[.45,-.08],[.55,.04],[.60,.07],[1,.12]]);
  const P={};
  const pelvis=V(sway,0.93,-0.05); P.pelvis=pelvis;
  P.hipL=add(pelvis,rotY(V(0.11,0,0.02),hipT)); P.hipR=add(pelvis,rotY(V(-0.11,0,0.02),hipT));
  P.footL=V(0.165,0.025,0.16);P.footR=V(-0.165,0.025,0.16);   // toes forward (+z)
  P.ankL=V(0.17,0.10,0.0);P.ankR=V(-0.17,0.10,0.0);
  P.kneeL=V(0.16,0.50,0.10);P.kneeR=V(-0.16,0.50,0.10);
  // side-bend: upper body leans away from target (head stays behind the ball) through impact
  const sideT=(ven?sched(ph,[[.12,3],[.6,7],[1,1]]):sched(ph,[[.12,6],[.45,3],[.60,17],[.8,11],[1,1]]))*D2R;
  const ct=Math.cos(spineTilt);
  const sd=norm(V(-ct*Math.sin(sideT),ct*Math.cos(sideT),Math.sin(spineTilt))), S=add(pelvis,scl(sd,0.52)); P.S=S;
  P.shoL=add(S,rotY(V(0.20,0,0),shoT)); P.shoR=add(S,rotY(V(-0.20,0,0),shoT));
  P.neck=add(S,scl(sd,0.05)); P.head=add(S,scl(sd,0.17));
  // ===== club on an inclined swing PLANE: one sweep angle keeps it ON the plane (a real circle) =====
  const SC=add(pelvis,scl(sd,0.50));                       // swing centre (sternum) — sways & tilts
  const ball=V(0.10,0.04,0.50);
  const e1=norm(sub(ball,SC));                             // down toward the ball (ψ=0)
  const n=norm(cross(e1,V(1,0,0)));                        // plane CONTAINS the target line -> face-on sees the arc
  const e2=norm(cross(n,e1));                              // ~toward target (+x): +ψ=follow side, -ψ=backswing
  const pdir=psi=>add(scl(e1,Math.cos(psi)),scl(e2,Math.sin(psi)));
  // hands angle (psiG) and club angle (psiC) are INDEPENDENT so the club can LAG the hands, then release.
  // backswing = -ψ (trail side); the club holds up near the top through transition, then whips to the ball.
  const psiG=sched(ph, ven?[[.12,0],[.45,-150],[.55,-82],[.60,0],[1,120]]:[[.12,0],[.45,-172],[.55,-95],[.60,0],[1,150]])*D2R;
  P.grip=add(SC,scl(pdir(psiG),0.46));
  // real arms: lead arm extends, trail arm folds; elbows bend down-and-out
  P.elbL=ik2(P.shoL,P.grip,0.29,0.28, V(0.55,-1,0.45));
  P.elbR=ik2(P.shoR,P.grip,0.29,0.28, V(-0.55,-1,0.35));
  // club hinges off the LEAD FOREARM by the wrist-cock angle (rotate in the swing plane).
  // ~0 at address/impact (in line with arm), ~95° at the top (full cock), held through transition, released by impact.
  // DOUBLE PENDULUM (clock hand + hinge + weight): the grip is the inner "clock hand" rotating around the
  // centre (pdir(psiG)); the club is the outer segment, hinged at the wrist by `cock` (pdir(psiG+cock)).
  // cock=0 -> club in line with the arm pointing at the ball (address & impact); cock~-90 -> folded up &
  // back toward the target (top, full cock); it holds the cock through transition, then releases by impact.
  const cock=sched(ph, ven?[[.12,0],[.45,-85],[.55,-80],[.58,-44],[.60,-3],[.72,28],[1,70]]:[[.12,0],[.45,-90],[.55,-84],[.58,-48],[.60,-3],[.72,32],[1,76]])*D2R;
  P.clubhead=add(P.grip, scl(pdir(psiG+cock), 0.84));
  // trail heel lifts through impact -> finish (pivot toward the toe)
  const heel=ven?sched(ph,[[.6,0],[.85,0.02],[1,0.04]]):sched(ph,[[.6,0],[.78,0.05],[1,0.11]]);
  P.ankR=V(P.ankR.x,P.ankR.y+heel,P.ankR.z+heel*0.6);
  P.kneeR=V(P.kneeR.x+heel*0.4,P.kneeR.y,P.kneeR.z+heel*0.3);
  P.ball=V(0.10,0.04,0.50);
  return P;
}

const BODY=[150,225,180], SKIN=[150,235,195], CLUB=[205,210,216];
let POSE=poseAt(phase);
const LS={x:-0.55,y:-0.83};   // screen-space light (comes from upper-left)

const cnv=document.getElementById("c"), ctx=cnv.getContext("2d");
let W=0,H=0;
function fit(){const w=cnv.clientWidth,dpr=devicePixelRatio||1;cnv.width=w*dpr;cnv.height=560*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);cam.f=560*0.64;W=w;H=560;}
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
function tint(col,depth,mul){const t=Math.max(0,Math.min(1,(cam.dist+0.7-depth)/1.7)),k=(0.55+0.45*t)*mul;return col.map(c=>Math.min(255,c*k));}
// a tapered, cylinder-shaded capsule with sphere-shaded end joints
function limb(a,b,ra,rb,col){
  const pa=project(a,W,H),pb=project(b,W,H);
  const wa=Math.max(1.2,ra*pa.s),wb=Math.max(1.2,rb*pb.s);
  let ax=pb.x-pa.x,ay=pb.y-pa.y;const ln=Math.hypot(ax,ay)||1;ax/=ln;ay/=ln;
  const px=-ay,py=ax,depth=(pa.z+pb.z)/2;
  const base=tint(col,depth,1),hi=base.map(c=>Math.min(255,c*1.55)),lo=base.map(c=>c*0.5);
  const litPlus=(px*-LS.x+py*-LS.y)>0, sx=litPlus?-px:px, sy=litPlus?-py:py;  // shadow-edge dir
  const cx=(pa.x+pb.x)/2,cy=(pa.y+pb.y)/2,w=(wa+wb)/2;
  const g=ctx.createLinearGradient(cx+sx*w,cy+sy*w,cx-sx*w,cy-sy*w);
  g.addColorStop(0,rgb(lo));g.addColorStop(.5,rgb(base));g.addColorStop(1,rgb(hi));
  ctx.fillStyle=g;ctx.beginPath();
  ctx.moveTo(pa.x+px*wa,pa.y+py*wa);ctx.lineTo(pb.x+px*wb,pb.y+py*wb);
  ctx.lineTo(pb.x-px*wb,pb.y-py*wb);ctx.lineTo(pa.x-px*wa,pa.y-py*wa);ctx.closePath();ctx.fill();
  joint(pa.x,pa.y,wa,base,hi,lo,sx,sy);joint(pb.x,pb.y,wb,base,hi,lo,sx,sy);
}
function joint(x,y,r,base,hi,lo,sx,sy){
  const g=ctx.createRadialGradient(x-sx*r*.5,y-sy*r*.5,r*.1,x,y,r);
  g.addColorStop(0,rgb(hi));g.addColorStop(.6,rgb(base));g.addColorStop(1,rgb(lo));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
}
function parts(){const P=POSE,C=BODY;return[
  {a:P.pelvis,b:P.S,ra:0.115,rb:0.10,col:C},
  {a:P.hipL,b:P.hipR,ra:0.075,rb:0.075,col:C},
  {a:P.shoL,b:P.shoR,ra:0.062,rb:0.062,col:C},
  {a:P.S,b:P.neck,ra:0.05,rb:0.046,col:C},
  {a:P.shoL,b:P.elbL,ra:0.052,rb:0.038,col:C},{a:P.elbL,b:P.grip,ra:0.038,rb:0.031,col:C},
  {a:P.shoR,b:P.elbR,ra:0.052,rb:0.038,col:C},{a:P.elbR,b:P.grip,ra:0.038,rb:0.031,col:C},
  {a:P.hipL,b:P.kneeL,ra:0.085,rb:0.058,col:C},{a:P.kneeL,b:P.ankL,ra:0.056,rb:0.04,col:C},{a:P.ankL,b:P.footL,ra:0.05,rb:0.038,col:C},
  {a:P.hipR,b:P.kneeR,ra:0.085,rb:0.058,col:C},{a:P.kneeR,b:P.ankR,ra:0.056,rb:0.04,col:C},{a:P.ankR,b:P.footR,ra:0.05,rb:0.038,col:C},
  {a:P.grip,b:P.clubhead,ra:0.014,rb:0.014,col:CLUB},
  {head:true},
];}
function render(){
  POSE=poseAt(phase); fit();
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0c1c2c");g.addColorStop(1,"#10283a");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(127,227,180,.09)";ctx.lineWidth=1;
  for(let i=-2;i<=2;i++){const a=project(V(i*0.5,0,-1),W,H),b=project(V(i*0.5,0,1.3),W,H);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  for(let j=-2;j<=3;j++){const a=project(V(-1.3,0,j*0.5),W,H),b=project(V(1.3,0,j*0.5),W,H);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  // ground shadow
  const gc=project(V(POSE.pelvis.x,0.0,0.05),W,H);
  ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(gc.x,gc.y,0.42*gc.s,0.14*gc.s,0,0,7);ctx.fill();
  // depth-sorted body parts
  const ps=parts();
  ps.forEach(p=>p.d=p.head?project(POSE.head,W,H).z:(project(p.a,W,H).z+project(p.b,W,H).z)/2);
  ps.sort((a,b)=>b.d-a.d);
  ps.forEach(p=>{
    if(p.head){const h=project(POSE.head,W,H),r=0.108*h.s,base=tint(SKIN,h.z,1),hi=base.map(c=>Math.min(255,c*1.5)),lo=base.map(c=>c*0.55);
      const rg=ctx.createRadialGradient(h.x+LS.x*r*.5,h.y+LS.y*r*.5,r*.15,h.x,h.y,r);
      rg.addColorStop(0,rgb(hi));rg.addColorStop(.6,rgb(base));rg.addColorStop(1,rgb(lo));ctx.fillStyle=rg;ctx.beginPath();ctx.arc(h.x,h.y,r,0,7);ctx.fill();}
    else limb(p.a,p.b,p.ra,p.rb,p.col);
  });
  const bp=project(POSE.ball,W,H);ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(bp.x,bp.y,Math.max(2,0.021*bp.s),0,7);ctx.fill();
  document.getElementById("lbl").textContent=phase<.14?"Address":phase<.46?"Backswing":phase<.5?"Top":phase<.63?"Impact":"Follow-through";
}

// interaction
let drag=null;
cnv.addEventListener("mousedown",e=>{drag={x:e.clientX,y:e.clientY,az:cam.az,el:cam.el};});
addEventListener("mousemove",e=>{if(!drag)return;cam.az=drag.az-(e.clientX-drag.x)*0.01;cam.el=Math.max(-0.3,Math.min(1.3,drag.el+(e.clientY-drag.y)*0.008));render();});
addEventListener("mouseup",()=>drag=null);
const phEl=document.getElementById("ph");
phEl.addEventListener("input",()=>{phase=parseFloat(phEl.value);render();});
function setCam(n,az,el){["face","dtl","top"].forEach(x=>document.getElementById("p-"+x).classList.toggle("on",x===n));cam.az=az;cam.el=el;render();}
document.getElementById("p-face").onclick=()=>setCam("face",0,0.05);
document.getElementById("p-dtl").onclick=()=>setCam("dtl",-1.15,0.12);
document.getElementById("p-top").onclick=()=>setCam("top",0,1.2);
function setStyle(s){style=s;document.getElementById("s-trad").classList.toggle("on",s==="trad");document.getElementById("s-ven").classList.toggle("on",s==="ven");render();}
document.getElementById("s-trad").onclick=()=>setStyle("trad");
document.getElementById("s-ven").onclick=()=>setStyle("ven");
let anim=null;
function swingPhase(t){
  if(t<200)return 0.12*smooth(t/200);                                 // settle
  if(t<1050)return 0.12+0.33*(1-(1-(t-200)/850)**2);                  // backswing: ease out into the top
  if(t<1200)return 0.45;                                              // pause at the top
  if(t<1500)return 0.45+0.15*((t-1200)/300)**2;                       // downswing: ACCELERATE into impact
  const u=Math.min(1,(t-1500)/680);                                   // follow-through: keep peak speed THROUGH
  return 0.60+0.40*(1-(1-u)**2);                                      // the ball, then decelerate to the finish
}
document.getElementById("play").onclick=()=>{if(anim)cancelAnimationFrame(anim);const t0=performance.now();
  (function step(now){const t=now-t0;phase=swingPhase(t);phEl.value=phase;render();if(t<2400)anim=requestAnimationFrame(step);})(t0);};
addEventListener("resize",render);
render();
</script>
</body></html>
