  rideBtn.textContent = ride === 'skis' ? '🎿 Skis' : '🏂 Board';
  document.getElementById('rideWord').textContent =
    ride === 'skis' ? 'The skis follow' : 'The board follows';
  if(mode === 'menu' || mode === 'over') showCardForMode();   // reword the open card
}
rideBtn.addEventListener('click', () => setRide(ride === 'board' ? 'skis' : 'board'));

/* ══ projection ═══════════════════════════════════════════════════════════ */
function proj(wx, wy, wz){
  const dx = wx - cam.x, dz = wz - cam.z;
  const cz =  dx*cam.sy + dz*cam.cy;                 // along the direction of travel
  if(cz < 0.55) return null;
  return screenOf({ cz, cx: dx*cam.cy - dz*cam.sy, cy: wy - cam.y });
}
// The world is drawn rolled about the horizon (a head tilt), so anything that
// has to line up with what the player *sees* goes through this.
function rollPt(px, py){
  const c = Math.cos(cam.roll), s = Math.sin(cam.roll), dx = px - W/2, dy = py - cam.rollY;
  return { x: W/2 + dx*c - dy*s, y: cam.rollY + dx*s + dy*c };
}

// Camera-space form, so a point can be clipped against the near plane before
// it is flattened to the screen.
function projRaw(wx, wy, wz){
  const dx = wx - cam.x, dz = wz - cam.z;
  return { cz: dx*cam.sy + dz*cam.cy, cx: dx*cam.cy - dz*cam.sy, cy: wy - cam.y };
}
/* A real pitch rotation, not a shifted horizon. This is the whole steepness
   trick: shearing the image (moving the vanishing point) leaves vertical lines
   vertical, so the slope reads flat no matter where the horizon sits. Rotating
   the camera down puts a tree's top at a smaller forward distance than its
   base, so it is magnified and splays away from centre — the keystone you see
   in any photo shot down a steep pitch. The trees themselves stay upright,
   because trees grow along gravity and so does the rider's head.            */
function screenOf(c){
  const cy2 =  c.cy*cam.cp + c.cz*cam.sp;
  const cz2 = -c.cy*cam.sp + c.cz*cam.cp;
  const k = F / Math.max(cz2, 0.45);
  return { sx: W/2 + c.cx*k, sy: H/2 - cy2*k, k, cz: c.cz, cx: c.cx };
}

let visible = [];               // trees in frame this tick, far → near
function gatherVisible(){
  visible.length = 0;
  const far = S.drawDist;
  const j0 = Math.floor((S.z - 28) / SP), j1 = Math.ceil((S.z + far) / SP);
  const i0 = Math.floor((S.x - 170) / SP), i1 = Math.ceil((S.x + 170) / SP);
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    const t = treeAt(i,j); if(!t) continue;
    const base = projRaw(t.x, surfY(t.x, t.z), t.z);
    if(base.cz < 0.55 || base.cz > far) continue;

    /* The trunk is vertical in the world; the pitched camera is what tips it.
       Its top sits at a smaller *rotated* depth than its base, so guard that
       depth — a tall tree close by would otherwise cross behind the lens and
       smear across the frame. Shortening it is invisible and always safe.   */
    const z0 = -base.cy*cam.sp + base.cz*cam.cp;
    let hEff = t.h;
    if(cam.sp > 1e-4){
      const hMax = (z0 - Math.max(0.9, z0*0.34)) / cam.sp;
      if(hMax < hEff) hEff = Math.max(0, hMax);
    }
    const p = screenOf(base);
    const q = screenOf({ cz: base.cz, cx: base.cx, cy: base.cy + hEff });

    const halfW = Math.max(p.k, q.k) * t.cr * 1.5 + 8;
    if(Math.min(p.sx,q.sx) < -halfW - 140 || Math.max(p.sx,q.sx) > W + halfW + 140) continue;

    /* Terrain occlusion. The ground is painted as one silhouette fill, so a
       tree drawn full-length gets pasted ON TOP of any nearer crest that
       should hide its base — a tree standing on snow that is not under it,
       which is the one remaining artifact that genuinely reads as floating.
       Compare against the highest ground strictly NEARER than the tree (the
       global silhouette is useless here: it includes ground beyond the tree,
       which can never occlude it). Fully hidden trees are dropped — so they
       stop pulling the eye too; a hidden base is clipped to the crest line. */
    if(cam.silPre){
      const oc = Math.round((p.sx + SILPAD) / SILW);
      if(oc >= 0 && oc < SILN){
        let k = -1; while(k+1 < NSLAB && SLB[k+1] <= p.cz - 4) k++;
        if(k >= 0){
          const occY = cam.silPre[oc*NSLAB + k];
          if(occY < 1e8 && p.sy > occY + 2){
            if(q.sy > occY + 1) continue;      // wholly behind the crest
            t.clipY = occY + 1;                // only the part above it shows
          }
        }
      }
    }

    t.p = p; t.q = q;
    // the visual centre of mass, and its apparent size — one definition shared
    // by the drawing, the fixation ring and the pull on the eye
    t.mx = p.sx + (q.sx - p.sx) * 0.55;
    t.my = p.sy + (q.sy - p.sy) * 0.55;
    t.R  = Math.max(4, lerp(p.k, q.k, 0.55) * t.cr);
    visible.push(t);
  }
  visible.sort((a,b) => b.p.cz - a.p.cz);
}

/* ══ update ═══════════════════════════════════════════════════════════════ */
// The camera is resolved first, because what you can see decides what can
// catch your eye, which decides where you steer.
function updateCamera(dt){
  S.bob += (mode === 'ride' ? S.v * 0.42 : 1.2) * dt * 60 * 0.016;
  cam.x = S.x; cam.z = S.z;
  cam.y = surfY(S.x, S.z) + EYE + Math.sin(S.bob)*0.045 + (mode==='wreck' ? -1.0*Math.min(1,S.wreckT*2.6) : 0);
  cam.yaw = S.yaw + (mode==='wreck' ? S.wreckT*2.2 : 0);
  cam.sy = Math.sin(cam.yaw); cam.cy = Math.cos(cam.yaw);
  cam.shakeX = (Math.random()-.5)*S.shake;
  // How far down the pitch you are looking. A rider on a 31° slope does not
  // stare at the horizon — they look down the fall line, and that camera angle
  // is what makes the trees splay and the snow fill the frame.
  /* A rider does not track the surface angle under their feet — they pick a
     spot down the hill and look at it. Aiming at the snow LOOK_D ahead is both
     what people actually do and self-smoothing: a rollover averages over the
     whole span instead of snapping the view down 20° at the lip. */
  const LOOK_D = 24;
  const drop = (surfY(S.x, S.z) + EYE) - surfY(S.x, S.z + LOOK_D);
  S.gazeRef = clamp(cam.skyMed === undefined ? H*0.62 : cam.skyMed + 190, 120, H-90);
  const look  = (S.eye.y - S.gazeRef) * 0.00050;
  // bob and shake go in as angles too, so the drawn horizon can never drift
  // apart from the projected one
  const jitter = (Math.cos(S.bob*2)*2.2 + (Math.random()-.5)*S.shake) / F;
  const want = clamp(Math.atan(drop / LOOK_D) + EXCESS + look, 0.02, 1.0);
  // and the head still lags the terrain a little
  cam.pitch = cam.pitch === undefined ? want
            : cam.pitch + (want - cam.pitch) * (1 - Math.exp(-dt/0.30)) - jitter;
  cam.sp = Math.sin(cam.pitch); cam.cp = Math.cos(cam.pitch);
  cam.hz = H/2 - F*Math.tan(cam.pitch);       // the TRUE horizon, usually off-screen

  /* Where the snow stops. On a descending slope the surface no longer reaches
     the horizon — it vanishes along its own line, and a roll in front of you
     cuts the view shorter still. This skyline is emphatically NOT a horizontal
     line: the ground only varies with z, but once you are yawed across the fall
     line a constant-z contour runs diagonally down the screen, and a far bench
     can stand above a near crest. So sample the actual view frustum and keep
     the highest ground per screen column. */
  const sil = cam.sil || (cam.sil = new Float32Array(SILN));
  sil.fill(1e9);
  const silPre = cam.silPre || (cam.silPre = new Float32Array(SILN * NSLAB));
  silPre.fill(1e9);
  /* Lateral resolution matters more than it looks: the screen gap between two
     adjacent samples works out to ~1000/SILL px *regardless of distance* (the
     sampled width and the projection scale both go as f, so they cancel), so
     one density covers every range. At 13 samples the gap was ~90 px — wider
     than a column — columns kept stale values, the fill stopped short and
     half the trees stood above the snow. Sample past drawDist too: the ground
     nearest the vanishing line is the highest on screen, and trees stop well
     before it. */
  const SILL = 128;
  for(let fi = 0; fi < 48; fi++){
    const f = 2.5 * Math.pow(1.13, fi);                 // dense near, sparse far
    if(f > 650) break;
    // Sweep wider than the strict frustum: a tree can sit well outside it and
    // still project into frame, and any column the sweep misses keeps a stale
    // value that leaves that tree standing above the snow.
    const halfL = f * 2.1 + 8;
    let slab = 0; while(slab < NSLAB-1 && f > SLB[slab]) slab++;
    for(let li = 0; li <= SILL; li++){
      const l = -halfL + (2*halfL) * (li/SILL);
      const wx = S.x + f*cam.sy + l*cam.cy;
      const wz = S.z + f*cam.cy - l*cam.sy;
      const p = proj(wx, surfY(wx, wz), wz);
      if(!p) continue;
      const c = Math.round((p.sx + SILPAD) / SILW);
      if(c < 0 || c >= SILN) continue;
      if(p.sy < sil[c]) sil[c] = p.sy;
      const si = c*NSLAB + slab;
      if(p.sy < silPre[si]) silPre[si] = p.sy;
    }
  }
  // prefix-min across slabs, so silPre[c][k] covers ALL ground nearer than SLB[k]
  for(let c=0;c<SILN;c++){
    const b = c*NSLAB;
    for(let k=1;k<NSLAB;k++) if(silPre[b+k-1] < silPre[b+k]) silPre[b+k] = silPre[b+k-1];
  }
  // fill columns nothing landed in, so the outline stays continuous
  let last = 1e9;
  for(let c=0;c<SILN;c++){ if(sil[c] > 1e8) sil[c] = last; else last = sil[c]; }
  last = 1e9;
  for(let c=SILN-1;c>=0;c--){ if(sil[c] > 1e8) sil[c] = last; else last = sil[c]; }
  /* A separate, smoothed copy for DRAWING. The raw per-column minima are what
     occlusion must use — they are the honest ground — but drawing them as a
     polyline shows every column boundary as a step, and a hard turn swings the
     contour diagonally so those steps line up into visible stair-stepping
     along the snow edge. Two light box passes take the jaggies out without
     moving the line more than a pixel or two. */
  const draw = cam.silDraw || (cam.silDraw = new Float32Array(SILN));
  for(let c=0;c<SILN;c++) draw[c] = sil[c];
  for(let pass=0; pass<2; pass++){
    let prev = draw[0];
    for(let c=1;c<SILN-1;c++){
      const cur = draw[c];
      draw[c] = (prev + cur*2 + draw[c+1]) * 0.25;
      prev = cur;
    }
  }

  let sky = 1e9;
  for(let c=0;c<SILN;c++) if(sil[c] < sky) sky = sil[c];
  cam.sky = sky > 1e8 ? H*0.4 : sky;
  /* The minimum is the highest ground *anywhere* across the frame, which when
     you are yawed across the fall line is often far off the top of the screen.
     Anything anchored to it — sky gradient, distant ridges, the gaze reference
     — then gets shoved out of frame, leaving a flat pale wash with no tonal
     break where the snow ends, and trees standing on an invisible edge. Use a
     representative on-screen boundary for those instead. */
  const srt = Array.prototype.slice.call(sil).sort((a,b) => a-b);
  cam.skyMed = clamp(srt[srt.length >> 1], -60, H - 40);
  cam.rollY = clamp(cam.skyMed, 0, H);        // roll about what you can see
  cam.roll = clamp(-S.turn*0.30, -.17, .17) + (mode==='wreck' ? -S.wreckT*1.5 : 0);
}

function update(dt){
  S.t += dt;
  updateCamera(dt);
  gatherVisible();

  /* ── 1. the eye ──────────────────────────────────────────────────────────
     A damped point chasing the mouse, with every nearby tree tugging on it.
     The tug grows the longer the eye rests on a trunk: that is the whole game. */
  const E = S.eye;
  const ix = clamp(mouse.x, 40, W-40), iy = clamp(mouse.y, 40, H-30);
  let ax = 140 * (ix - E.x) - 22 * E.vx;      // spring toward intent
  let ay = 140 * (iy - E.y) - 22 * E.vy;

  let topFix = 0, topTree = null;
  const gain = S.d.fix * (mode === 'ride' ? 1 : 0);
  for(const t of visible){
    /* What catches the eye is a property of the obstacle, not its type. A trunk
       does; a boulder scattered in the gaps does not, or the pull stops meaning
       "don't look at the trees"; a chute wall does, because in a couloir the
       rock beside you is exactly the thing you fixate on. */
    if(t.p.cz > 62 || t.soft || (t.rock && !t.pull)) continue;
    const R = t.R;                                             // apparent crown radius
    // The world is drawn rolled, so the trunk has to be rolled into true screen
    // space before it can be compared with the eye — the eye lives in the head.
    const r = rollPt(t.mx, t.my);                              // its mass, not its base
    const tx = r.x, ty = r.y;
    const dx = tx - E.x, dy = ty - E.y;
    const d  = Math.hypot(dx, dy) || 1e-3;

    let f = fixOf(t.key);
    if(d < R * 1.05 + 18*SCL) f = Math.min(1, f + dt * 1.5 * S.d.fix);
    else                      f = Math.max(0, f - dt * 1.25);
    if(f > 0.002) FIX.set(t.key, f); else FIX.delete(t.key);

    const sal    = clamp(R / (45*SCL), 0, 1.7);                 // big and close = loud
    const threat = 0.32 + 0.68 * Math.exp(-Math.pow(t.p.cx / 7, 2)); // the one you might hit
    const fall   = Math.exp(-Math.pow(d / (R*1.6 + 78*SCL), 2));
    const mag    = 3900 * gain * sal * threat * fall * (0.42 + 1.45*f);
    ax += mag * dx / d; ay += mag * dy / d;

    const relevance = f * threat;
    if(relevance > topFix){ topFix = relevance; topTree = t; }
  }

  /* The chute wall pulls on its own account. It is swept geometry, not an
     obstacle in `visible`, so it cannot go through the loop above — but in a
     couloir the rock beside you is precisely what catches the eye, and without
     this the one idea the game has would simply not apply in a chute. Sampled
     at a few distances up each wall; fixation is keyed to a bucket of world z
     so it accumulates on a particular stretch of rock rather than on whichever
     sample happens to be nearest this frame. */
  if(CHUTE && mode === 'ride'){
    for(const side of [-1, 1]){
      for(const ahead of [7, 13, 21, 32]){
        const z = S.z + ahead;
        const hw = chuteHW(z), wx = chuteX(z) + side*hw;
        const gy = surfY(wx, z);
        const p = proj(wx, gy + Math.max(2, chuteWallH(z, side))*0.22, z);
        if(!p || p.cz > 62) continue;
        const r = rollPt(p.sx, p.sy);
        const dx = r.x - E.x, dy = r.y - E.y;
        const d = Math.hypot(dx, dy) || 1e-3;
        const R = Math.max(24, p.k * 3.2);           // a face, not a trunk
        const key = 'w' + side + ':' + Math.round(z/6);
        let f = fixOf(key);
        if(d < R*1.05 + 18*SCL) f = Math.min(1, f + dt * 1.5 * S.d.fix);
        else                    f = Math.max(0, f - dt * 1.25);
        if(f > 0.002) FIX.set(key, f); else FIX.delete(key);
        const sal  = clamp(R / (45*SCL), 0, 1.7);
        const fall = Math.exp(-Math.pow(d / (R*1.6 + 78*SCL), 2));
        const mag  = 3900 * gain * sal * 0.75 * fall * (0.42 + 1.45*f);
        ax += mag * dx / d; ay += mag * dy / d;
        if(f * 0.75 > topFix){ topFix = f * 0.75; topTree = null; }
      }
    }
  }

  E.vx += ax*dt; E.vy += ay*dt;
  E.x = clamp(E.x + E.vx*dt, -60, W+60);
  E.y = clamp(E.y + E.vy*dt, 20, H-10);
  S.fix = lerp(S.fix, topFix, 1 - Math.exp(-dt*7));
  S.fixTree = topTree;

  if(mode !== 'ride'){ updateFx(dt); return; }

  /* ── 2. steering: the board goes where the eye goes ────────────────────── */
  /* The TRUE angle to where you are looking, through the actual lens — not a
     pixel offset. It matters: with a 104° frame the two differ by 1.6×, and
     steering by pixels quietly guts the game, because a trunk your gaze is
     locked onto sits at a smaller pixel offset than its real bearing, so you
     under-steer and slide past it. Measured at n=60, pixels gave 3.1×
     separation with overlapping quartiles; the true angle gives 6.0× with
     none. STEER_G only sets how fast you converge on whatever you look at. */
  const aX = Math.atan2(E.x - W/2, F);
  const wMax = 1.55 * 13 / (8 + S.v);                       // powder turns get wider with speed
  const want = clamp(aX * STEER_G, -wMax, wMax);
  S.turn += (want - S.turn) * (1 - Math.exp(-dt/0.22));
  S.yaw = clamp(S.yaw + S.turn*dt, -1.15, 1.15);            // you can't ride fully across

  /* ── 3. speed: gravity down the fall line, scrubbed by the turn ──────────
     Now that the ground really descends, the pull is the *local* pitch — you
     gather speed over a rollover and give it back on the bench below.       */
  const vmax = S.d.vmax * (1 + Math.min(S.dist/4000, .35));
  const steep = Math.sin(Math.atan(surfTan(S.x, S.z))) / Math.sin(SLOPE);
  S.steep = steep;
  const target = vmax * (0.34 + 0.66 * Math.cos(S.yaw)) * clamp(steep, 0.55, 1.4);
  S.v += ((target - S.v) * 0.55 - Math.abs(S.turn) * S.v * 0.52) * dt;
  S.v = clamp(S.v, 2.5, vmax * 1.45);
  S.topV = Math.max(S.topV, S.v);

  const px = S.x, pz = S.z;
  S.x += S.v * Math.sin(S.yaw) * dt;
  S.z += S.v * Math.cos(S.yaw) * dt;
  S.dist += S.v * dt;

  /* The couloir wall is authoritative, not emergent. Building it out of jittered
     boulders and hoping their collision circles overlap does not hold: the
     jitter alone can open a 3.5m gap, and an adversarial line found a way
     through in 1 run of every 4 — ending up outside the chute in empty space,
     which is a worse outcome than crashing. The rocks are the wall's face; this
     is the wall. */
  if(CHUTE){
    const off = Math.abs(S.x - chuteX(S.z)) - chuteHW(S.z);
    if(off > -0.6){ wreck(); return; }
  }

  /* ── 4. what you just rode past ────────────────────────────────────────── */
  const jA = Math.floor((pz - SP) / SP), jB = Math.floor((S.z + SP) / SP);
  const iA = Math.floor((S.x - 5) / SP), iB = Math.floor((S.x + 5) / SP);
  for(let j=jA;j<=jB;j++) for(let i=iA;i<=iB;i++){
    const t = treeAt(i,j); if(!t || S.hitKeys.has(t.key)) continue;
    if(t.z > S.z + 0.4 || t.z < pz - 3) continue;
    const d = segDist(px, pz, S.x, S.z, t.x, t.z);
    const hit  = t.tr + 0.48;
    const near = t.tr + 2.15;
    if(d > near) continue;
    S.hitKeys.add(t.key);
    const side = (t.x - S.x) > 0 ? 1 : -1;
    if(d < hit){
      if(t.soft){                                            // a sapling: a slap, not a wreck
        S.v *= 0.80; S.shake = Math.max(S.shake, 9); S.flash = Math.max(S.flash, .35);
        S.flow = Math.max(0, S.flow - .16);
        puff(side, 26); sfx('slap', side*.5);
        pop('SAPLING', '#9fd8ff');
      } else { wreck(); return; }                            // trunk or boulder
    }else{
      S.calls++;
      const tight = 1 - (d - hit) / (near - hit);            // 0 at the edge, 1 at the paint
      const mult = 1 + 3*S.flow;
      const pts = Math.round((28 + 90*tight*tight) * mult * (t.h > 11 ? 1.25 : 1));
      S.score += pts;
      S.flow = Math.min(1, S.flow + .05 + .09*tight);
      puff(side, 10 + 20*tight);
      sfx('whoosh', side * .7);
      pop('+' + pts + (tight > .62 ? '  THREADED' : ''), tight > .62 ? '#5ce0a0' : '#cfe6ff');
      S.shake = Math.max(S.shake, 3*tight);
    }
  }
  if(S.hitKeys.size > 400) S.hitKeys.clear();
  /* Evict fixation for anything now behind you. Two key shapes live in here:
     "i,j" for obstacle cells and "w<side>:<zbucket>" for stretches of chute
     wall. Parsing only the first shape leaves the wall keys unreachable and the
     map grows without bound for the whole run. */
  for(const k of FIX.keys()){
    const zBehind = k.charCodeAt(0) === 119            // 'w' — a wall stretch
      ? (+k.slice(k.indexOf(':')+1)) * 6
      : (+k.split(',')[1]) * SP;
    if(zBehind < S.z - 40) FIX.delete(k);
  }

  /* ── 5. flow: reading ahead builds it, fixating burns it ───────────────── */
  const lookDown = clamp((E.y - (S.gazeRef || H*0.60)) / (H*0.26), 0, 1);
  S.lookDown = lookDown;
  S.drawDist = lerp(138, 72, lookDown);                      // stare at your feet, see less
  if(S.fix > .3) S.flow = Math.max(0, S.flow - dt * 0.75 * S.fix);
  else           S.flow = Math.min(1, S.flow + dt * (0.055 + 0.10*(1-lookDown)));
  S.score += S.v * dt * (1 + 3*S.flow) * 0.55;

  updateFx(dt);
}

function segDist(x1,z1,x2,z2,px,pz){
  const dx = x2-x1, dz = z2-z1, L = dx*dx + dz*dz;
  let t = L > 1e-9 ? ((px-x1)*dx + (pz-z1)*dz) / L : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (x1+dx*t), pz - (z1+dz*t));
}

function wreck(){
  mode = 'wreck'; S.wreckT = 0; S.flash = 1; S.shake = 34;
  sfx('crash'); bedStop();
  for(let i=0;i<90;i++) S.spray.push({
    x: W/2 + (Math.random()-.5)*420, y: H*0.72 + (Math.random()-.5)*220,
    vx:(Math.random()-.5)*640, vy:-160 - Math.random()*520,
    r: 3 + Math.random()*15, life: .8 + Math.random()*1.1, age:0
  });
}

function puff(side, n){
  for(let i=0;i<n;i++) S.spray.push({
    x: W/2 + side*(60 + Math.random()*130), y: H*0.90 + Math.random()*60,
    vx: side*(70 + Math.random()*280), vy: -70 - Math.random()*260,
    r: 2 + Math.random()*9, life: .35 + Math.random()*.55, age: 0
  });
}
function pop(txt, col){ S.pops.push({ txt, col, age:0, life:1.25, y: 0 }); }

function updateFx(dt){
  // carve spray off the edge
  if(mode === 'ride'){
    // Enough to feel the board working, but it has to stay low in the frame —
    // spray that climbs into the middle hides the very gaps you are reading.
    const rate = Math.abs(S.turn) * S.v * 3.0 + S.v * 0.9;
    S.sprayAcc = (S.sprayAcc || 0) + rate * dt;
    while(S.sprayAcc > 1){
      S.sprayAcc -= 1;
      const side = S.turn > 0 ? -1 : 1;   // snow flies off the uphill edge
      S.spray.push({
        x: W/2 + side*(20 + Math.random()*170), y: H*0.97 + Math.random()*45,
        vx: side*(40 + Math.random()*200) - S.turn*100, vy: -35 - Math.random()*130 - S.v*2.4,
        r: 1.5 + Math.random()*5.5, life: .3 + Math.random()*.42, age: 0
      });
    }
  }
  for(let i=S.spray.length-1;i>=0;i--){
    const p = S.spray[i]; p.age += dt;
    if(p.age > p.life){ S.spray.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 430*dt; p.vx *= (1 - 1.6*dt);
  }
  for(let i=S.pops.length-1;i>=0;i--){
    const q = S.pops[i]; q.age += dt; q.y += dt*38;
    if(q.age > q.life) S.pops.splice(i,1);
  }
  // snow in the air — held in camera space so it streaks correctly
  const dyaw = (cam.yaw - (S.prevYaw ?? cam.yaw)); S.prevYaw = cam.yaw;
  const cs = Math.cos(-dyaw), sn = Math.sin(-dyaw);
  for(const f of S.flakes){
    const nx = f.x*cs - f.z*sn, nz = f.x*sn + f.z*cs;
    f.x = nx; f.z = nz - (mode==='ride' ? S.v : 0)*dt;
    f.y -= (0.9 + f.r) * dt;
    if(f.z < 0.8 || f.z > 40 || Math.abs(f.y) > 22){
      f.z = 6 + Math.random()*34; f.x = (Math.random()-.5)*40; f.y = (Math.random()-.5)*20;
    }
  }
  S.shake = Math.max(0, S.shake - dt*30);
  S.flash = Math.max(0, S.flash - dt*1.7);
}

/* ══ render ═══════════════════════════════════════════════════════════════ */
const FOG = [231, 242, 252];
function fogMix(rgb, t){
  t = clamp(t, 0, 1);
  return `rgb(${Math.round(lerp(rgb[0],FOG[0],t))},${Math.round(lerp(rgb[1],FOG[1],t))},${Math.round(lerp(rgb[2],FOG[2],t))})`;
}

function render(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(cam.shakeX || 0, 0);
  ctx.translate(W/2, cam.rollY); ctx.rotate(cam.roll); ctx.translate(-W/2, -cam.rollY);

  drawSky();
  drawRidges();          // distant peaks sit behind the snow, not on top of it
  drawGround();
  drawChuteWalls();      // canyon sides, behind anything standing in the chute
  for(const t of visible){
    if(t.clipY !== undefined){       // base hidden behind a nearer crest
      ctx.save();
      ctx.beginPath(); ctx.rect(-340, -340, W + 680, t.clipY + 340); ctx.clip();
      drawTree(t);
      ctx.restore();
    } else drawTree(t);
  }
  if(S.fixTree && S.fix > .16) drawFixRing(S.fixTree);
  drawFlakes();

  ctx.restore();

  drawSpray();
  drawBoard();
  drawVignette();
  drawReticle();
  drawHUD();
  if(S.flash > 0){
    ctx.fillStyle = `rgba(255,255,255,${Math.min(.92, S.flash)})`;
    ctx.fillRect(0,0,W,H);
  }
}

function drawSky(){
  const g = ctx.createLinearGradient(0, cam.skyMed - H, 0, cam.skyMed + 4);
  // Keep real tone right down to the horizon: a sky that fades to the same
  // white as the snow erases the edge of the slope, and trees standing on that
  // edge then look like they are hovering in a white void.
  g.addColorStop(0,   '#2f6bab');
  g.addColorStop(.42, '#5d9bd2');
  g.addColorStop(.78, '#93c3e6');
  g.addColorStop(1,   '#b9d6ee');
  // Sky covers everything; the snow is then painted over it as a silhouette.
  ctx.fillStyle = g;
  ctx.fillRect(-340, -340, W + 680, H + 680);
  // a low sun off to one side
  const sunA = -0.55 - S.yaw;
  const sx = W/2 + Math.tan(clamp(sunA, -1.2, 1.2)) * F;
  const sg = ctx.createRadialGradient(sx, cam.skyMed - 120, 8, sx, cam.skyMed - 120, 340);
  sg.addColorStop(0, 'rgba(255,247,225,.55)');
  sg.addColorStop(1, 'rgba(255,247,225,0)');
  ctx.fillStyle = sg; ctx.fillRect(-340, -340, W + 680, H + 680);
}

/* The outline of the snow against the sky. Drawn as a curve through the column
   midpoints rather than straight segments between them — a polyline puts a
   corner at every column, and on a hard turn those corners align into a
   sawtooth along the edge. Uses the smoothed copy; occlusion keeps the raw. */
function groundPath(){
  const s = cam.silDraw || cam.sil;
  const y = c => Math.min(s[c], H + 340);
  ctx.beginPath();
  ctx.moveTo(silX(0), H + 340);
  ctx.lineTo(silX(0), y(0));
  for(let c=1;c<SILN-1;c++){
    const mx = (silX(c) + silX(c+1)) * 0.5, my = (y(c) + y(c+1)) * 0.5;
    ctx.quadraticCurveTo(silX(c), y(c), mx, my);
  }
  ctx.lineTo(silX(SILN-1), y(SILN-1));
  ctx.lineTo(silX(SILN-1), H + 340);
  ctx.closePath();
}

function drawGround(){
  const g = ctx.createLinearGradient(0, cam.skyMed, 0, H + 300);
  g.addColorStop(0,   '#e7f1fb');
  g.addColorStop(.10, '#e2edfa');
  g.addColorStop(.45, '#f4f9ff');
  g.addColorStop(1,   '#ffffff');
  ctx.fillStyle = g;
  groundPath(); ctx.fill();
  /* No cross-slope banding here. These used to be full-width fillRects at fixed
     distances, which is wrong twice over: a constant-distance contour is not a
     horizontal line once you are yawed across the fall line, and a hard-edged
     bar spanning the frame reads as a horizon — so every tree beyond it appears
     to float, which is just correct perspective being misread. The terrain's
     own cross-slope shape carries the surface now — nothing is painted on. */
}

/* The canyon walls. Swept along each edge of the corridor and projected like
   everything else, so they converge with the chute, ride the terrain's own
   undulation, and pinch shut at a choke without any special-casing. Drawn
   before the obstacles: the talus and any mid-chute boulder then sits in front
   of the rock behind it, which is the ordering that matters here since the
   walls are at the edges and the obstacles are down the middle. */
function drawChuteWalls(){
  if(!CHUTE) return;
  const far = Math.min(S.drawDist, 160);
  const sunA = clamp(-0.55 - S.yaw, -1.2, 1.2);
  const lightX = clamp(Math.tan(sunA) * F / 620, -1, 1);
  /* The flanks are SNOW first and rock second — that ratio is the whole look.
     A couloir wall is a snow slope sweeping up and leaning outward as it rises,
     with rock breaking through it in ribs and outcrops; drawing rock with snow
     stuck on it gets the relationship backwards and reads as a quarry. FLARE is
     that outward lean, which is what makes the gully concave rather than a
     pair of vertical slabs. */
  const FLARE = 17;
  const LV = [0, .12, .26, .42, .60, .80, 1];

  const wallPt = (z, f, side) => {
    const wx = chuteX(z) + side*(chuteHW(z) + FLARE*Math.pow(f, 1.5));
    const gy = surfY(wx, z);
    return proj(wx, gy + Math.max(3, chuteWallH(z, side))*f, z);
  };

  for(const side of [-1, 1]){
    const lit = (side > 0) === (lightX > 0);
    const lvl = LV.map(() => []);
    for(let d = 1.6; d <= far; d *= 1.035){
      const z = S.z + d;
      const ps = LV.map(f => wallPt(z, f, side));
      if(ps.some(p => !p)) continue;
      ps.forEach((p, k) => lvl[k].push(p.sx, p.sy));
    }
    if(lvl[0].length < 6) continue;
    const base = lvl[0], top = lvl[LV.length-1];

    // the snow flank
    ctx.beginPath();
    ctx.moveTo(base[0], base[1]);
    for(let n=2;n<base.length;n+=2) ctx.lineTo(base[n], base[n+1]);
    for(let n=top.length-2;n>=0;n-=2) ctx.lineTo(top[n], top[n+1]);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, cam.skyMed - 260, 0, cam.skyMed + 200);
    if(lit){ g.addColorStop(0,'#dfeaf7'); g.addColorStop(.6,'#eef4fb'); g.addColorStop(1,'#f7fbff'); }
    else   { g.addColorStop(0,'#a8bcd6'); g.addColorStop(.6,'#c2d2e6'); g.addColorStop(1,'#d8e4f1'); }
    ctx.fillStyle = g; ctx.fill();

    ctx.save(); ctx.clip();

    /* Rock breaking through. Drawn as irregular blobs around a centre rather
       than quads spanning a height band: a band-quad gets foreshortened into a
       long thin sliver and the wall ends up looking like broken glass. Placed
       with value noise over (run, height) so outcrops clump into ribs and
       buttresses — coherence is what makes them read as geology. */
    const zStart = Math.floor(S.z/4)*4;
    for(let zz = zStart; zz < S.z + far; zz += 4){
      for(let k = 1; k < LV.length-1; k++){
        const n = vnoise(zz*0.055, k*1.31 + (side>0?11:29), 53);
        if(n < 0.52 - k*0.028) continue;             // more rock higher up
        const bucket = Math.round(zz/4);
        const cz = zz + rnd(bucket,k,61)*3;
        const cf = LV[k] + (LV[k+1]-LV[k]) * (0.2 + 0.6*rnd(bucket,k,63));
        const scale = 0.55 + 0.75*rnd(bucket,k,65);
        const pts = [];
        for(let a = 0; a < 7; a++){
          const ang = a/7 * 6.2832;
          const rad = 0.65 + 0.55*rnd(bucket, a + k*7, 67);
          const p = wallPt(cz + Math.cos(ang)*rad*scale*4.2,
                           clamp(cf + Math.sin(ang)*rad*scale*0.085, 0.02, 1), side);
          if(!p){ pts.length = 0; break; }
          pts.push(p);
        }
        if(pts.length < 7) continue;
        ctx.beginPath(); ctx.moveTo(pts[0].sx, pts[0].sy);
        for(let m=1;m<pts.length;m++) ctx.lineTo(pts[m].sx, pts[m].sy);
        ctx.closePath();
        const t = clamp((n - 0.5) * 3, 0, 1);
        ctx.fillStyle = lit ? `rgba(104,99,99,${0.38 + 0.42*t})`
                            : `rgba(60,62,72,${0.42 + 0.44*t})`;
        ctx.fill();
      }
    }
    ctx.restore();

    // The toe is a soft shadow, not a line: corridor snow and flank snow are
    // the same surface, and an edge there would read as a seam.
    ctx.beginPath();
    ctx.moveTo(base[0], base[1]);
    for(let n=2;n<base.length;n+=2) ctx.lineTo(base[n], base[n+1]);
    ctx.strokeStyle = lit ? 'rgba(150,176,206,.22)' : 'rgba(120,146,180,.30)';
    ctx.lineWidth = 7; ctx.lineJoin = 'round'; ctx.stroke();
  }
}

function drawRidges(){
  // Peaks live at infinity, so they only pan with yaw: walk screen x, invert to
  // a world azimuth, and read the skyline off a noise field of that azimuth.
  for(let layer=0; layer<2; layer++){
    const amp  = layer ? 46 : 82, base = layer ? 6 : 18;
    ctx.fillStyle = layer ? 'rgba(150,183,216,.72)' : 'rgba(120,158,198,.55)';
    ctx.beginPath();
    // Fill all the way down: the snow silhouette covers whatever it owns, and
    // a polygon ending at a fixed height paints a hard horizontal edge across
    // the frame wherever the snow line dips below it — a false shore, and one
    // more line for the eye to mistake for the ground.
    ctx.moveTo(-320, H + 340);
    for(let sx = -320; sx <= W+320; sx += 14){
      const az = Math.atan2(sx - W/2, F) + cam.yaw;
      const u  = az * (layer ? 5.4 : 3.1) + layer*17.3;
      const hgt = base + amp * (0.32 + 0.68*vnoise(u, layer*4.5, 21+layer));
      ctx.lineTo(sx, cam.skyMed - hgt);
    }
    ctx.lineTo(W+320, H + 340);
    ctx.closePath(); ctx.fill();
  }
  /* Far haze. Kept weak and spread wide on purpose: a strong band here paints a
     hard horizontal edge clean across the frame, and the eye reads that edge as
     the snow surface. Every tree standing above it — which is simply every tree
     further away, correct perspective — then looks like it is floating. */
  const g = ctx.createLinearGradient(0, cam.skyMed - 70, 0, cam.skyMed + 96);
  g.addColorStop(0, 'rgba(231,242,252,0)');
  g.addColorStop(.45,'rgba(231,242,252,.42)');
  g.addColorStop(1, 'rgba(231,242,252,0)');
  ctx.fillStyle = g; ctx.fillRect(-320, cam.skyMed - 70, W+640, 166);
}

/* Scattered blobs tell you a patch of snow is bumpy; they do NOT tell you the
   ground runs continuously from your board out to the treeline. Only structure
   that travels *along* the fall line does that — it converges toward the
   vanishing point and ties the empty foreground to the distant trees. Without
   it the near snow reads as a blank field with a band of trees hovering beyond
   it, no matter how well each individual trunk is shadowed. */
function drawTree(t){
  const p = t.p, q = t.q, fogT = clamp(Math.pow(p.cz / S.drawDist, 1.45), 0, .94);
  // The trunk axis in screen space — leaning back uphill, so it is no longer
  // vertical. Every part of the tree is laid out along it.
  const axX = q.sx - p.sx, axY = q.sy - p.sy;
  const hpx = Math.hypot(axX, axY);
  if(hpx < 1.2) return;
  const nx = -axY/hpx, ny = axX/hpx;                 // unit normal to the trunk
  const wpx = t.R;
  // a point at fraction `f` up the trunk, offset `w` px across it
  const A = (f, w) => [ p.sx + axX*f + nx*w, p.sy + axY*f + ny*w ];
  const kAt = f => lerp(p.k, q.k, f);                // the top is nearer, so wider
  const fixAmt = fixOf(t.key);

  // the well: powder piles into a moat around every trunk
  /* Ground contact. This has to be a soft pool, never a disc: a hard-edged
     ellipse scaled off the crown turns into a visible platter, and a stand of
     mid-distance trees becomes a row of lily pads with trees perched on them —
     which reads as floating far more strongly than no shadow at all. So: keep
     it tight (scaled off the TRUNK, not the crown), build the falloff from
     nested rings so there is no rim, and no bright white mound to outline it. */
  const wr  = Math.max(1.5, p.k * (t.tr*2.6 + 0.30));
  const wry = Math.max(0.8, wr * clamp(
    Math.sin(cam.pitch - Math.atan(surfTan(t.x, t.z)) + Math.atan(EYE/p.cz)), .05, .8));
  // More rings at lower alpha: three was enough when these were small, but on a
  // near trunk the steps between them read as concentric circles drawn on the
  // snow — the exact thing the clean surface is meant to be free of.
  const pool = (1-fogT) * clamp((520 - wr)/300, 0, 1) * 0.105;
  if(pool > .004){
    for(let s=0;s<5;s++){
      const f = 1 - s*0.185;
      ctx.fillStyle = `rgba(112,148,194,${pool})`;
      ctx.beginPath();
      ctx.ellipse(p.sx + wr*.10*f, p.sy + wry*.16, wr*f, wry*f, 0, 0, 6.2832); ctx.fill();
    }
  }

  if(t.rock){
    /* A boulder half-buried in the drift. Faceted rather than smooth so it sits
       in the same low-poly language as the trees, lit from the same sun, and
       capped with snow — the cap is what makes it read as sitting IN the snow
       rather than on top of it. Low and wide, so it never looks like a trunk. */
    const sunA = clamp(-0.55 - S.yaw, -1.2, 1.2);
    const litSide = clamp(Math.tan(sunA) * F / 620, -1, 1) >= 0 ? 1 : -1;
    const grey = t.tint < .5 ? [64,66,73] : [74,72,74];
    const body = fogMix(grey, fogT);
    const lit  = fogMix([grey[0]+46, grey[1]+48, grey[2]+52], fogT);
    const cap  = fogMix([246,251,255], fogT*.6);
    // silhouette: bottom-left, over the crown, down to bottom-right
    const sil = [[-1,0],[-.94,.34],[-.66,.72],[-.24,.96],[.22,1],[.66,.74],[.95,.36],[1,0]];
    const jit = k => 1 + (rnd(t.key.length, k, 17) - .5) * 0.22;   // angular, not domed
    // A() takes the across-axis offset in PIXELS, so the ±1 silhouette
    // fractions have to be scaled by the rock's apparent half-width.
    const pt = ([w,f], k) => A(f*jit(k), w*wpx*jit(k+9));
    ctx.beginPath();
    sil.forEach((s,k) => { const q2 = pt(s,k); k ? ctx.lineTo(q2[0],q2[1]) : ctx.moveTo(q2[0],q2[1]); });
    ctx.closePath(); ctx.fillStyle = body; ctx.fill();
    if(wpx > 3){                                     // sun-facing face
      ctx.beginPath();
      const face = litSide > 0 ? [[.22,1],[.66,.74],[.95,.36],[1,0],[.12,.12]]
                               : [[-.24,.96],[-.66,.72],[-.94,.34],[-1,0],[-.10,.12]];
      face.forEach((s,k) => { const q2 = pt(s,k+3); k ? ctx.lineTo(q2[0],q2[1]) : ctx.moveTo(q2[0],q2[1]); });
      ctx.closePath(); ctx.fillStyle = lit; ctx.fill();
      // snow sitting on the crown
      ctx.beginPath();
      [[-.52,.80],[-.14,.99],[.30,.98],[.62,.78],[.20,.86],[-.20,.88]]
        .forEach((s,k) => { const q2 = pt(s,k+5); k ? ctx.lineTo(q2[0],q2[1]) : ctx.moveTo(q2[0],q2[1]); });
      ctx.closePath(); ctx.fillStyle = cap; ctx.globalAlpha = .9; ctx.fill(); ctx.globalAlpha = 1;
    }
    return;
  }

  if(t.soft){
    // A sapling buried to the tips: a clump of loaded snow with a few twigs
    // still showing. You can ride through it — it just costs you.
    const shade = fogMix([176,201,226], fogT), lit = fogMix([252,254,255], fogT*.7);
    ctx.strokeStyle = fogMix([46,58,44], fogT*.8);
    ctx.lineWidth = Math.max(.7, wpx*.055);
    for(let n=0;n<3;n++){
      const a = -1.9 + n*0.62 + (t.tint-.5);
      ctx.beginPath(); ctx.moveTo(p.sx, p.sy);
      ctx.lineTo(p.sx + Math.cos(a)*wpx*.85, p.sy + Math.sin(a)*hpx*1.05);
      ctx.stroke();
    }
    for(let n=0;n<3;n++){
      const ox = (n-1)*wpx*.46, oy = -hpx*(.34 + .20*(1-Math.abs(n-1)));
      const rr = wpx*(.42 + .16*(1-Math.abs(n-1)));
      ctx.fillStyle = shade;
      ctx.beginPath(); ctx.ellipse(p.sx+ox, p.sy+oy, rr, rr*.78, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = lit;
      ctx.beginPath(); ctx.ellipse(p.sx+ox-rr*.10, p.sy+oy-rr*.20, rr*.84, rr*.62, 0, 0, 6.2832); ctx.fill();
    }
    return;
  }

  /* Lit and shaded faces of the same needle colour. The sun is the one drawn
     into the sky, so the bright side of every trunk agrees with it and swings
     round as you change heading — a flat tint would read as cut paper no
     matter how good the silhouette is. */
  const green = t.tint < .5 ? [18,42,30] : [22,36,26];
  const sunA  = clamp(-0.55 - S.yaw, -1.2, 1.2);
  const LX    = clamp(Math.tan(sunA) * F / 620, -1, 1);   // <0 sun to the left
  const litSide = LX >= 0 ? 1 : -1;
  const punch = 0.35 + 0.5*Math.abs(LX);                  // face-on sun = flatter
  const body  = fogMix(green, fogT);
  const litC  = fogMix([green[0] + 40*punch, green[1] + 62*punch, green[2] + 44*punch], fogT);
  const shadeC= fogMix([green[0]*0.52, green[1]*0.55, green[2]*0.55], fogT);
  const snowC = fogMix([248,252,255], fogT*.55);
  const snowS = fogMix([196,214,236], fogT*.55);          // snow on the shaded face

  const tri = (a, b, c) => {
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]);
    ctx.closePath(); ctx.fill();
  };

  if(wpx < 2.4){                                     // far enough away to be a smudge
    const w = Math.max(.8, wpx);
    ctx.fillStyle = body;
    tri(A(1,0), A(0, w), A(0, -w));
    return;
  }

  // trunk — a quad, because it leans; darker on the side away from the sun
  const trw = Math.max(1, p.k * t.tr);
  const t0 = A(0, trw), t1 = A(0, -trw), t2 = A(0.22, -trw*0.86), t3 = A(0.22, trw*0.86);
  ctx.fillStyle = fogMix([44,32,24], fogT);
  ctx.beginPath(); ctx.moveTo(t0[0],t0[1]); ctx.lineTo(t1[0],t1[1]);
  ctx.lineTo(t2[0],t2[1]); ctx.lineTo(t3[0],t3[1]); ctx.closePath(); ctx.fill();
  if(trw > 1.6){
    const e0 = A(0, trw*litSide), e1 = A(0, trw*litSide*0.25),
          e2 = A(0.22, trw*litSide*0.22), e3 = A(0.22, trw*litSide*0.86);
    ctx.fillStyle = fogMix([74,56,42], fogT);
    ctx.beginPath(); ctx.moveTo(e0[0],e0[1]); ctx.lineTo(e1[0],e1[1]);
    ctx.lineTo(e2[0],e2[1]); ctx.lineTo(e3[0],e3[1]); ctx.closePath(); ctx.fill();
  }

  /* Crown: each tier is a CONE, not a triangle. The base curves away from the
     apex instead of running straight across, which is the whole difference —
     a straight base is a flat cut-out, a bowed one has a far rim you are
     looking over the top of. Then a lit facet down the sun side of each cone
     gives it a body. Both are cheap; together they do most of the 3D work. */
  const FB = 0.16, N = 5;                            // crown starts 16% up the trunk
  const solid = wpx > 4.5;
  for(let n=0;n<N;n++){
    const fb = FB + (1-FB) * (n/N) * 0.86;
    const ft = FB + (1-FB) * Math.min(1, (n+1.25)/N) * 0.98;
    const w  = t.cr * (1 - n/N*0.62) * kAt(fb);
    const db = (ft - fb) * 0.30;                     // how far the rim bows below the base
    const ap = A(ft, 0), bR = A(fb, w), bL = A(fb, -w), ctl = A(fb - 2*db, 0);

    ctx.fillStyle = solid ? shadeC : body;           // whole cone in shadow…
    ctx.beginPath();
    ctx.moveTo(ap[0], ap[1]); ctx.lineTo(bR[0], bR[1]);
    ctx.quadraticCurveTo(ctl[0], ctl[1], bL[0], bL[1]);
    ctx.closePath(); ctx.fill();

    if(solid){                                       // …then the sun-facing facet
      const bS = A(fb, w*litSide), cS = A(fb - 1.15*db, w*litSide*0.16);
      ctx.fillStyle = litC;
      ctx.beginPath();
      ctx.moveTo(ap[0], ap[1]); ctx.lineTo(bS[0], bS[1]);
      ctx.quadraticCurveTo(cS[0], cS[1], ctl[0], ctl[1]);
      ctx.closePath(); ctx.fill();
    }

    // snow load, riding the upper shoulder — brighter where the sun reaches it
    if(wpx > 5){
      const sgn = -litSide;                          // shoulder away from the sun
      const s0 = A(ft, 0), s1 = A(fb, w*0.92*sgn), s2 = A(fb, w*0.50*sgn),
            s3 = A(lerp(ft, fb, 0.30), w*0.06*sgn);
      ctx.fillStyle = snowS; ctx.globalAlpha = .70;
      ctx.beginPath(); ctx.moveTo(s0[0],s0[1]); ctx.lineTo(s1[0],s1[1]);
      ctx.lineTo(s2[0],s2[1]); ctx.lineTo(s3[0],s3[1]); ctx.closePath(); ctx.fill();
      const l1 = A(fb, w*0.86*litSide), l2 = A(fb, w*0.38*litSide),
            l3 = A(lerp(ft, fb, 0.34), w*0.05*litSide);
      ctx.fillStyle = snowC; ctx.globalAlpha = .82;
      ctx.beginPath(); ctx.moveTo(s0[0],s0[1]); ctx.lineTo(l1[0],l1[1]);
      ctx.lineTo(l2[0],l2[1]); ctx.lineTo(l3[0],l3[1]); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  if(wpx > 5){                                       // capped tip
    const fc = 1 - (1-FB)*0.13, wc = t.cr*0.16*kAt(fc);
    ctx.fillStyle = snowC;
    tri(A(1, 0), A(fc, wc), A(fc, -wc));
  }
  // it is watching you back
  if(fixAmt > .05){
    ctx.save();
    ctx.translate(t.mx, t.my); ctx.rotate(Math.atan2(axY, axX) + Math.PI/2);
    ctx.strokeStyle = `rgba(255,90,114,${fixAmt*.55})`;
    ctx.lineWidth = 1 + fixAmt*2;
    ctx.beginPath(); ctx.ellipse(0, 0, wpx*1.5, hpx*.58, 0, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }
}

function drawFixRing(t){
  const f = S.fix;
  const cx = t.mx, cy = t.my;
  const R  = Math.max(26, t.R*1.7) * (1.6 - .6*f);
  ctx.save();
  ctx.strokeStyle = `rgba(255,90,114,${.25 + .6*f})`;
  ctx.lineWidth = 2;
  ctx.setLineDash([9, 7]); ctx.lineDashOffset = -S.t*40;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.stroke();
  ctx.restore();
}

function drawFlakes(){
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for(const f of S.flakes){
    if(f.z < 0.8) continue;
    const s = screenOf({ cx: f.x, cy: f.y, cz: f.z });
    const sx = s.sx, sy = s.sy, k = s.k;
    if(sx < -30 || sx > W+30 || sy < -30 || sy > H+30) continue;
    const r = Math.max(.4, f.r*k*0.06);
    if(r > 1.6 && mode === 'ride' && S.v > 8){          // streak at speed
      ctx.globalAlpha = .55;
      ctx.fillRect(sx - r*.4, sy, r*.8, Math.min(48, S.v*k*0.02));
      ctx.globalAlpha = 1;
    }
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, 6.2832); ctx.fill();
  }
}

function drawSpray(){
  for(const p of S.spray){
    const a = (1 - p.age/p.life);
    ctx.fillStyle = `rgba(255,255,255,${a*.85})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(0.6+a*0.8), 0, 6.2832); ctx.fill();
  }
}

// Board or skis — purely what is strapped to your feet. The physics underneath
// is identical either way, so switching is cosmetic and never changes a run.
function drawBoard(){ ride === 'skis' ? drawSkis() : drawSnowboard(); }

/* Fat powder skis — deliberately built from the same curve as the snowboard,
   just scaled down and doubled, so they read as two mini boards rather than
   race sticks: wide underfoot, big blunt rockered tips, plenty of surface to
   float on. Both take the same rotation as the board, so they stay parallel at
   every turn angle; only the inside foot leading breaks the symmetry, and that
   is a translation, which cannot splay them. */
function drawSkis(){
  const slip = clamp(S.turn*0.30, -.30, .30);
  const bob  = Math.sin(S.bob)*5 + (mode==='wreck' ? S.wreckT*160 : 0);
  const L = 176, w = 27;
  for(const side of [-1, 1]){
    ctx.save();
    ctx.translate(W/2 + S.turn*46 + side*46, H + 40 + bob + (side === Math.sign(S.turn || 1) ? 7 : 0));
    ctx.rotate(slip);                                     // identical angle: always parallel
    ctx.beginPath();
    ctx.moveTo(0, -L);                                    // blunt rockered tip
    ctx.bezierCurveTo(w*.78, -L+14, w, -L*.60, w*.94, 0); // widest underfoot
    ctx.lineTo(-w*.94, 0);
    ctx.bezierCurveTo(-w, -L*.60, -w*.78, -L+14, 0, -L);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -L, 0, 0);      // topsheet
    g.addColorStop(0, '#26313f'); g.addColorStop(.5, '#18222e'); g.addColorStop(1, '#0e161f');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(200,228,255,.52)'; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.fillStyle = 'rgba(127,209,255,.28)';              // stripe down the middle
    ctx.fillRect(-4, -L+24, 8, L*.58);
    ctx.fillStyle = 'rgba(255,255,255,.15)';              // snow stuck to the deck
    ctx.beginPath(); ctx.ellipse(-w*.32, -L*.46, w*.42, L*.13, .25, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(11,16,21,.94)';                 // binding
    ctx.fillRect(-w*.92, -L*.56, w*1.84, 26);
    ctx.strokeStyle = 'rgba(150,180,200,.30)'; ctx.lineWidth = 1.3;
    ctx.strokeRect(-w*.92, -L*.56, w*1.84, 26);
    ctx.restore();
  }
}

function drawSnowboard(){
  // The nose of the board, foreshortened at the bottom of the frame. The nose
  // is drawn pointing up and canvas rotate() swings it right for a positive
  // angle, so slip tracks S.turn directly: look right, turn right, nose right.
  const slip = clamp(S.turn*0.30, -.30, .30);
  const bob  = Math.sin(S.bob)*5 + (mode==='wreck' ? S.wreckT*160 : 0);
  ctx.save();
  ctx.translate(W/2 + S.turn*46, H + 38 + bob);
  ctx.rotate(slip);
  const L = 158, w = 66;
  ctx.beginPath();
  ctx.moveTo(0, -L);
  ctx.bezierCurveTo(w*.75, -L+16, w, -L*.55, w*.92, 0);
  ctx.lineTo(-w*.92, 0);
  ctx.bezierCurveTo(-w, -L*.55, -w*.75, -L+16, 0, -L);
  ctx.closePath();
  const g = ctx.createLinearGradient(0,-L,0,0);
  g.addColorStop(0, '#22303f'); g.addColorStop(.5,'#16212e'); g.addColorStop(1,'#0d151f');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(200,228,255,.55)'; ctx.lineWidth = 2.5; ctx.stroke();
  // a stripe, and snow stuck to the deck
  ctx.fillStyle = 'rgba(127,209,255,.30)';
  ctx.fillRect(-4, -L+22, 8, L-28);
  ctx.fillStyle = 'rgba(255,255,255,.16)';
  ctx.beginPath(); ctx.ellipse(-w*.35, -L*.42, w*.28, L*.16, .3, 0, 6.2832); ctx.fill();
  ctx.restore();
}

function drawVignette(){
  const fx = S.fix;
  const g = ctx.createRadialGradient(W/2, H*0.46, H*0.34, W/2, H*0.46, H*1.02);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, `rgba(${fx>.35?60:10},${fx>.35?6:22},${fx>.35?18:44},${.20 + .42*fx})`);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  if(fx > .35){                                       // tunnel vision
    const r = ctx.createRadialGradient(W/2, H*0.46, H*0.18, W/2, H*0.46, H*0.75);
    r.addColorStop(0,'rgba(255,60,90,0)');
    r.addColorStop(1,`rgba(255,60,90,${(fx-.35)*0.42})`);
    ctx.fillStyle = r; ctx.fillRect(0,0,W,H);
  }
  if(mode === 'ride' && S.v > 14){                    // speed streaks from the vanishing point
    const a = clamp((S.v-14)/16, 0, 1) * .5;
    ctx.strokeStyle = `rgba(255,255,255,${a*.5})`; ctx.lineWidth = 1.4;
    for(let i=0;i<26;i++){
      const ang = rnd(i, Math.floor(S.t*3), 51) * 6.2832;
      const r0 = 200 + rnd(i, Math.floor(S.t*3), 52)*380;
      const c = Math.cos(ang), s = Math.sin(ang);
      ctx.beginPath();
      ctx.moveTo(W/2 + c*r0, cam.rollY + s*r0);
      ctx.lineTo(W/2 + c*(r0+40+a*90), cam.rollY + s*(r0+40+a*90));
      ctx.stroke();
    }
  }
}

// Everything here has to stay legible against bright snow, so each mark is
// drawn twice: a dark casing first, then the colour on top.
function stroke2(path, col, lw){
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(10,22,38,.55)'; ctx.lineWidth = lw + 2.6; path();
  ctx.strokeStyle = col;                  ctx.lineWidth = lw;       path();
}
function drawReticle(){
  const E = S.eye, fx = S.fix;
  if(showIntent){
    const ix = clamp(mouse.x,40,W-40), iy = clamp(mouse.y,40,H-30);
    stroke2(() => {
      ctx.beginPath();
      ctx.moveTo(ix-7,iy); ctx.lineTo(ix+7,iy); ctx.moveTo(ix,iy-7); ctx.lineTo(ix,iy+7);
      ctx.stroke();
    }, 'rgba(255,255,255,.85)', 1.3);
    const d = Math.hypot(ix-E.x, iy-E.y);
    if(d > 26){                                       // the tension between want and do
      ctx.strokeStyle = `rgba(255,86,110,${clamp((d-26)/140,0,.75)})`;
      ctx.lineWidth = 1.6; ctx.setLineDash([4,5]);
      ctx.beginPath(); ctx.moveTo(ix,iy); ctx.lineTo(E.x,E.y); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  const col = fx > .5 ? '255,86,110' : fx > .2 ? '255,186,72' : '255,255,255';
  const r = 13 + fx*7;
  stroke2(() => { ctx.beginPath(); ctx.arc(E.x, E.y, r, 0, 6.2832); ctx.stroke(); }, `rgba(${col},.98)`, 2);
  stroke2(() => {
    ctx.beginPath();
    for(let i=0;i<4;i++){
      const a = i*Math.PI/2 + Math.PI/4;
      ctx.moveTo(E.x + Math.cos(a)*(r+4), E.y + Math.sin(a)*(r+4));
      ctx.lineTo(E.x + Math.cos(a)*(r+9), E.y + Math.sin(a)*(r+9));
    }
    ctx.stroke();
  }, `rgba(${col},.9)`, 1.8);
  ctx.fillStyle = 'rgba(10,22,38,.6)';
  ctx.beginPath(); ctx.arc(E.x, E.y, 3.2, 0, 6.2832); ctx.fill();
  ctx.fillStyle = `rgba(${col},.98)`;
  ctx.beginPath(); ctx.arc(E.x, E.y, 1.8, 0, 6.2832); ctx.fill();
}

function drawHUD(){
  ctx.textBaseline = 'top';
  // a goggle-brow scrim, so instrument text survives a white-on-white scene
  const sc = ctx.createLinearGradient(0, 0, 0, 108);
  sc.addColorStop(0, 'rgba(6,14,26,.62)'); sc.addColorStop(1, 'rgba(6,14,26,0)');
  ctx.fillStyle = sc; ctx.fillRect(0, 0, W, 108);
  // speed + distance
  ctx.fillStyle = 'rgba(232,241,251,.95)';
  ctx.font = '600 15px ui-monospace,SFMono-Regular,Menlo,monospace';
  ctx.textAlign = 'left';
  // v is speed across the map; on the snow you are travelling the hypotenuse
  const trueV = S.v * Math.hypot(1, surfTan(S.x, S.z));
  ctx.fillText(String(Math.round(trueV*3.6)).padStart(3,' ') + ' km/h', 20, 18);
  ctx.fillStyle = 'rgba(160,190,220,.85)';
  ctx.font = '500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace';
  ctx.fillText(Math.round(S.dist) + ' m ridden', 20, 40);
  ctx.fillText(S.calls + ' close calls', 20, 58);

  // flow
  const mult = 1 + 3*S.flow;
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(232,241,251,.95)';
  ctx.font = '600 15px ui-monospace,SFMono-Regular,Menlo,monospace';
  ctx.fillText(Math.round(S.score).toLocaleString(), W-20, 18);
  ctx.fillStyle = S.flow > .6 ? 'rgba(92,224,160,.95)' : 'rgba(160,190,220,.85)';
  ctx.font = '600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace';
  ctx.fillText('FLOW ×' + mult.toFixed(1), W-20, 40);
  const bw = 120;
  ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(W-20-bw, 60, bw, 5);
  ctx.fillStyle = S.flow > .6 ? '#5ce0a0' : '#7fd1ff';
  ctx.fillRect(W-20-bw, 60, bw*S.flow, 5);

  // the nag
  ctx.shadowColor = 'rgba(8,18,32,.85)'; ctx.shadowBlur = 8;
  if(S.fix > .42){
    const a = clamp((S.fix-.42)/.35, 0, 1);
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(255,90,114,${a})`;
    ctx.font = '700 21px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
    ctx.fillText('LOOK AWAY', W/2, H*0.20);
  }
  if(S.lookDown > .72 && mode === 'ride'){
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(240,180,41,${(S.lookDown-.72)/.28*.9})`;
    ctx.font = '600 14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
    ctx.fillText('EYES UP — you can\'t see the line from there', W/2, H*0.27);
  }
  // score pops
  ctx.textAlign = 'center';
  ctx.font = '700 15px ui-monospace,SFMono-Regular,Menlo,monospace';
  for(const q of S.pops){
    ctx.fillStyle = hexA(q.col, 1 - q.age/q.life);
    ctx.fillText(q.txt, W/2, H*0.60 - q.y);
  }
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
}
function hexA(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${clamp(a,0,1)})`;
}

/* ══ overlays ═════════════════════════════════════════════════════════════ */
const ov = document.getElementById('ov'), ovCard = document.getElementById('ovCard');
function diffHTML(compact){
  return `<div class="diffs${compact?' compact':''}">` + Object.keys(DIFFS).map(k =>
    `<div class="diff${k===diffKey?' sel':''}" data-k="${k}">
       <div class="n">${DIFFS[k].name}</div><div class="d">${DIFFS[k].desc}</div></div>`).join('') + `</div>`;
}
function wireCard(){
  ovCard.querySelectorAll('.diff').forEach(el => el.addEventListener('click', () => {
    diffKey = el.dataset.k;
    ovCard.querySelectorAll('.diff').forEach(x => x.classList.toggle('sel', x === el));
  }));
  const b = ovCard.querySelector('.bigbtn');
  if(b) b.addEventListener('click', begin);
}
function menuCardHTML(){
  const goes = ride === 'skis' ? 'the skis go' : 'the board goes';
  return `
    <h2>Don't look at the <span class="em">trees</span></h2>
    <p>First-person, waist-deep, somewhere with no patrol. The reticle is your <b>gaze</b>,
       and ${goes} where your gaze goes. Trees <b>pull on your gaze</b> — the longer you
       look at one, the harder it is to look anywhere else. That is how people hit them.</p>
    <div class="keys">
      <span class="key">${matchMedia('(pointer: coarse)').matches
        ? 'Drag to <b>look</b>' : 'Move the mouse to <b>look</b>'}</span>
      <span class="key">Ride the <b>gap</b>, never the trunk</span>
      <span class="key">Eyes <b>up</b> and far to see the line</span>
    </div>
    ${diffHTML(false)}
    <button class="bigbtn">Drop in</button>`;
}
function overCardHTML(){
  return `
    <h2>Yard <span class="em">sale</span></h2>
    <p>You found a tree. Or rather, it found your eye first.</p>
    <div class="tally">
      <div class="l">Distance</div><div class="v">${Math.round(S.dist)} m</div>
      <div class="l">Top speed</div><div class="v">${Math.round(S.topV*3.6)} km/h</div>
      <div class="l">Close calls</div><div class="v">${S.calls}</div>
      <div class="l tot">Score</div><div class="v tot">${Math.round(S.score).toLocaleString()}</div>
      <div class="l">Best today</div><div class="v">${best.toLocaleString()}</div>
    </div>
    ${diffHTML(true)}
    <div style="height:18px"></div>
    <button class="bigbtn">Hike back up</button>`;
}
/* Does the open card actually fit inside the stage? The stage is aspect-locked,
   so its height falls out of the page width and on a phone it is far shorter
   than the card — which used to hide the Drop in button below the fold with no
   way to reach it. Measure rather than guess at a breakpoint, and let the card
   break out into a full-viewport sheet only when it genuinely has to. */
function fitOverlay(){
  const box = document.querySelector('.stagebox');
  if(!box) return;
  ov.classList.remove('sheet');                       // measure unsheeted
  const r = ovCard.getBoundingClientRect();
  /* Test the thing that actually matters — is the whole card on screen where
     it currently sits — rather than a proxy for it. Fitting the stage is not
     enough: in landscape the stage is wide, so it is also TALL, and runs off
     the bottom of a short viewport carrying the button with it. */
  const fitsStage    = ovCard.scrollHeight + 28 <= box.clientHeight;
  const fitsViewport = r.top >= 0 && r.bottom <= innerHeight;
  if(!fitsStage || !fitsViewport) ov.classList.add('sheet');
}
addEventListener('resize', () => { if(!ov.classList.contains('hide')) fitOverlay(); });

// Re-render whichever card is open, without touching game state — swapping the
// ride mid-menu must not reroll the mountain out from under you.
function showCardForMode(){
  if(mode === 'menu')      ovCard.innerHTML = menuCardHTML();
  else if(mode === 'over') ovCard.innerHTML = overCardHTML();
  else return;
  wireCard(); fitOverlay();
}
function showMenu(){
  mode = 'menu'; newRun();
  ovCard.innerHTML = menuCardHTML();
  ov.classList.remove('hide'); wireCard(); fitOverlay();
}
function showOver(){
  mode = 'over';
  best = Math.max(best, Math.round(S.score));
  ovCard.innerHTML = overCardHTML();
  ov.classList.remove('hide'); wireCard(); fitOverlay();
}
function begin(){
  newRun(); startBed(); mode = 'ride';
  ov.classList.add('hide');
}

/* ══ loop ═════════════════════════════════════════════════════════════════ */
let last = performance.now();
function frame(now){
  /* Clamp rather than skip. A rAF timestamp is the frame's start time, which
     can PREDATE a performance.now() taken while the script was still parsing,
     so the very first dt is sometimes zero or negative. Skipping update() on
     that frame used to be fatal: update() is what builds the camera, render()
     without it throws, and the throw escapes before the tail call that queues
     the next frame — so the loop died permanently and the page sat there with
     a blank canvas behind the menu and a Drop in button that did nothing.
     Whether it happened came down to parse timing, hence "reload a few times
     and it works". A zero-length step is harmless; a dead loop is not. */
  const dt = clamp((now - last) / 1000, 0, 1/20);
  last = now;
  if(mode === 'wreck'){
    S.wreckT += dt;
    update(dt);
    if(S.wreckT > 1.35) showOver();
  } else {
    update(dt);
  }
  if(mode === 'ride'){
    bedSet(clamp(S.v / 26, 0, 1.2), clamp(Math.abs(S.turn)*S.v/14, 0, 1), S.fix);
  }
  render();
  requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
