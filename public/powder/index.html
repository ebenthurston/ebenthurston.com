<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store" />
<title>Powder — Don't Look at the Trees</title>
<style>
  :root{
    --bg:#080d16; --panel:#101a2a; --panel2:#16233a; --line:#26374f;
    --txt:#e8f1fb; --muted:#8399b5; --accent:#7fd1ff; --accent2:#2a8fbd;
    --warn:#f0b429; --good:#5ce0a0; --bad:#ff5a72;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none}
  header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;letter-spacing:.3px;font-weight:600}
  header .tag{color:var(--muted);font-size:12.5px;font-weight:400}
  .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#dff1ff,var(--accent2));
    display:flex;align-items:center;justify-content:center;font-size:16px}
  header .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .tbtn{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
  .tbtn:hover{color:var(--txt);border-color:var(--accent2)}
  .tbtn.on{color:var(--accent);border-color:var(--accent2);background:rgba(127,209,255,.10)}

  .wrap{max-width:1180px;margin:0 auto;padding:16px 18px 40px}
  .stagebox{position:relative;background:#05080f;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  canvas{display:block;width:100%;aspect-ratio:1000/620;touch-action:none;cursor:none}

  .overlay{position:absolute;inset:0;display:flex;
    background:rgba(5,9,16,.84);backdrop-filter:blur(3px);text-align:center;padding:24px;
    overflow-y:auto;-webkit-overflow-scrolling:touch}
  .overlay.hide{display:none}
  /* Auto margins centre the card AND let it scroll when it is taller than the
     frame. Flex centring alone cannot: it clips the overflowing top, putting
     part of the card permanently out of reach. */
  .ocard{max-width:600px;margin:auto}
  .ocard h2{font-size:31px;margin:0 0 8px;letter-spacing:-.4px}
  .ocard h2 .em{color:var(--accent)}
  .ocard p{color:var(--muted);font-size:14px;line-height:1.65;margin:0 0 18px}
  .ocard p b{color:var(--txt);font-weight:600}
  .keys{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 20px}
  .key{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;
    font-size:12px;color:var(--muted)}
  .key b{color:var(--txt);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .diffs{display:flex;gap:10px;justify-content:center;margin:0 0 18px;flex-wrap:wrap}
  .diff{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 16px;
    cursor:pointer;transition:.15s;min-width:150px}
  .diff:hover{border-color:var(--accent2)}
  .diff.sel{border-color:var(--accent);background:rgba(127,209,255,.09)}
  .diff .n{font-size:13.5px;font-weight:600}
  .diff .d{font-size:11px;color:var(--muted);margin-top:3px}
  .diffs.compact{gap:8px;margin-bottom:0}
  .diffs.compact .diff{min-width:0;padding:7px 15px}
  .diffs.compact .d{display:none}
  /* 14px padding puts the button at 45px tall — clears the 44px minimum tap
     target on touch screens wide enough to keep the card inline (iPad). */
  .bigbtn{padding:14px 30px;background:var(--accent);border:none;color:#062232;border-radius:10px;
    cursor:pointer;font-size:15px;font-weight:700;letter-spacing:.2px}
  .bigbtn:hover{filter:brightness(1.08)}
  .tally{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:13.5px;
    max-width:340px;margin:0 auto 20px;text-align:left}
  .tally .l{color:var(--muted)}
  .tally .v{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
  .tally .tot{border-top:1px solid var(--line);padding-top:7px;margin-top:5px}
  .foot{color:var(--muted);font-size:11.5px;line-height:1.6;margin-top:14px;text-align:center}
  .foot b{color:var(--txt)}
  a.back{color:var(--muted);text-decoration:none;font-size:12.5px}
  a.back:hover{color:var(--accent)}

  /* The stage is locked to a 1000:620 aspect, so on a phone it is only ~210px
     tall — a third of what the drop-in card needs, leaving the button clipped
     below the fold with no way to reach it. When the card cannot fit the stage
     it breaks out into a full-viewport sheet instead. That is decided by
     MEASURING the two (see fitOverlay), not by a width breakpoint: a narrow
     desktop window is wide enough for the card and should keep the card inside
     the stage where it belongs. */
  .overlay.sheet{position:fixed;padding:20px 16px}

  /* Type compaction, which genuinely is about narrow screens. */
  /* Landscape phone: plenty of width, almost no height. Tighten the vertical
     rhythm so the card fits outright instead of needing a scroll for the sake
     of a few pixels. Button padding is left alone — it is a touch target. */
  @media (max-height: 470px){
    .overlay.sheet{padding:12px 16px}
    .ocard h2{font-size:21px;margin-bottom:4px}
    .ocard p{font-size:12px;line-height:1.45;margin-bottom:10px}
    .keys{margin-bottom:10px;gap:5px}
    .key{padding:5px 9px;font-size:11px}
    .diffs{margin-bottom:10px}
    .diff{padding:7px 8px}
    .tally{margin-bottom:10px}
  }
  @media (max-width: 720px){
    .ocard h2{font-size:25px;margin-bottom:6px}
    .ocard p{font-size:13px;line-height:1.55;margin-bottom:14px}
    .keys{gap:6px;margin-bottom:14px}
    .key{padding:6px 10px;font-size:11.5px}
    .diffs{gap:7px;margin-bottom:14px}
    .diff{min-width:0;flex:1 1 30%;padding:9px 8px}
    .diff .n{font-size:12.5px}
    .diff .d{font-size:10.5px;margin-top:2px}
    .bigbtn{padding:15px 36px;font-size:16px}
    .tally{font-size:12.5px;max-width:300px;margin-bottom:16px}
  }
</style>
</head>
<body>
<header>
  <div class="logo">🏔</div>
  <h1>Powder <span class="tag">· backcountry trees · you go where you look</span></h1>
  <span class="right">
    <button class="tbtn on" id="rideBtn" title="Switch between snowboard and skis">🏂 Board</button>
    <button class="tbtn on" id="intentBtn" title="Show where the mouse is, vs. where you're actually looking">✛ Intent marker</button>
    <button class="tbtn on" id="sndBtn" title="Sound">♪ Sound</button>
    <a class="back" href="../">← Sandbox</a>
  </span>
</header>

<div class="wrap">
  <div class="stagebox">
    <canvas id="cv"></canvas>
    <div class="overlay" id="ov"><div class="ocard" id="ovCard"></div></div>
  </div>
  <div class="foot">
    <span id="rideWord">The board follows</span> your <b>eye</b>, not your mouse — and the trees pull on your eye. Stare at one and the
    reticle sticks to it, which is exactly how you hit it. Ride the <b>gaps</b>; the closer you thread them, the more flow you build.
  </div>
</div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   POWDER — first-person backcountry tree riding
   Single-file, vanilla JS + canvas. Logical stage is 1000×620 px; the world
   is in metres. The whole game is one idea: target fixation. Your gaze is a
   damped point that trees attract; your board turns toward your gaze.
   ══════════════════════════════════════════════════════════════════════════ */

const CV = document.getElementById('cv'), ctx = CV.getContext('2d');
const W = 1000, H = 620;
// A GoPro on the helmet: much wider than an eye, which is what gives the
// reference footage its splayed trunks and its huge foreground.
const FOV = 104 * Math.PI / 180;
const F   = (W / 2) / Math.tan(FOV / 2);   // focal length in px  (≈391)
// Handling and the pull of the trees were tuned against a 78° frame. Both work
// in screen pixels, so they keep that reference and stay unchanged by the lens.
const F_REF = 616, SCL = F / F_REF;
let STEER_G = 2.3;                         // how hard the board chases the gaze
const EYE = 1.58;                          // eye height above the snow (m)
const HZ0 = H * 0.44;                      // where the horizon sits on the flat
// The snow's skyline, sampled per screen column (see updateCamera)
const SILPAD = 340, SILW = 15, SILN = Math.ceil((W + 2*SILPAD) / SILW) + 1;
const silX = c => c*SILW - SILPAD;
// Depth slabs for terrain occlusion: silPre[c][k] is the highest snow in
// column c that lies NEARER than SLB[k] metres. A tree behind a crest checks
// the slab just short of its own depth — the global silhouette can't do this,
// because it mixes in ground *beyond* the tree, which can never occlude it.
const SLB = [10, 16, 25, 38, 58, 88, 134, 650], NSLAB = SLB.length;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  CV.width  = Math.round(W * dpr);
  CV.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;

/* ══ audio ════════════════════════════════════════════════════════════════
   Two looping noise beds (wind + edge spray) whose gains track the physics,
   plus one-shots. Everything is synthesised; no assets.                     */
let AC = null, sound = true, bed = null;
function ac(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function noiseBuf(a, dur, decay){
  const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (decay ? (1 - i/n) : 1);
  return b;
}
function startBed(){
  if(bed) return;
  try{
    const a = ac();
    if(a.state === 'suspended') a.resume();
    const loop = noiseBuf(a, 2.4, false);
    const mk = (type, freq, q) => {
      const s = a.createBufferSource(); s.buffer = loop; s.loop = true;
      const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq; if(q) f.Q.value = q;
      const g = a.createGain(); g.gain.value = 0;
      s.connect(f); f.connect(g); g.connect(a.destination); s.start();
      return { f, g };
    };
    const wind  = mk('lowpass',  520);        // rush of air past the hood
    const carve = mk('bandpass', 1500, 0.8);  // the edge cutting snow
    const drone = (() => {                    // the sound of fixation
      const o = a.createOscillator(); o.type = 'sine'; o.frequency.value = 58;
      const o2 = a.createOscillator(); o2.type = 'sine'; o2.frequency.value = 87.2;
      const g = a.createGain(); g.gain.value = 0;
      o.connect(g); o2.connect(g); g.connect(a.destination); o.start(); o2.start();
      return { g };
    })();
    bed = { a, wind, carve, drone };
  }catch(e){ /* audio is a nicety, never a failure */ }
}
function bedSet(vNorm, carveAmt, fix){
  if(!bed) return;
  try{
    const t = bed.a.currentTime, on = sound ? 1 : 0;
    bed.wind.g.gain.setTargetAtTime(0.055 * vNorm * vNorm * on, t, .09);
    bed.wind.f.frequency.setTargetAtTime(360 + 900*vNorm, t, .12);
    bed.carve.g.gain.setTargetAtTime(0.075 * carveAmt * on, t, .07);
    bed.carve.f.frequency.setTargetAtTime(900 + 2200*carveAmt, t, .09);
    bed.drone.g.gain.setTargetAtTime(0.035 * Math.max(0, fix-.25) * on, t, .14);
  }catch(e){}
}
function sfx(kind, pan){
  if(!sound) return;
  try{
    const a = ac(), t = a.currentTime, g = a.createGain();
    let out = g;
    if(pan !== undefined && a.createStereoPanner){
      const p = a.createStereoPanner(); p.pan.value = clamp(pan,-1,1); g.connect(p); p.connect(a.destination);
    } else g.connect(a.destination);
    if(kind === 'whoosh'){                    // a trunk going by, close
      const s = a.createBufferSource(), f = a.createBiquadFilter();
      s.buffer = noiseBuf(a, .3, true); f.type='bandpass'; f.Q.value=1.4;
      f.frequency.setValueAtTime(2600,t); f.frequency.exponentialRampToValueAtTime(420,t+.28);
      g.gain.setValueAtTime(.20,t); g.gain.exponentialRampToValueAtTime(.001,t+.3);
      s.connect(f); f.connect(out); s.start(t);
    }else if(kind === 'slap'){                // a sapling taking the hit
      const s = a.createBufferSource(), f = a.createBiquadFilter();
      s.buffer = noiseBuf(a, .22, true); f.type='highpass'; f.frequency.value = 900;
      g.gain.setValueAtTime(.24,t); g.gain.exponentialRampToValueAtTime(.001,t+.22);
      s.connect(f); f.connect(out); s.start(t);
    }else if(kind === 'crash'){
      const s = a.createBufferSource(), f = a.createBiquadFilter();
      s.buffer = noiseBuf(a, 1.1, true); f.type='lowpass';
      f.frequency.setValueAtTime(1400,t); f.frequency.exponentialRampToValueAtTime(70,t+.9);
      g.gain.setValueAtTime(.42,t); g.gain.exponentialRampToValueAtTime(.001,t+1.1);
      s.connect(f); f.connect(out); s.start(t);
      const o = a.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(38,t+.5);
      const g2 = a.createGain(); g2.gain.setValueAtTime(.4,t); g2.gain.exponentialRampToValueAtTime(.001,t+.6);
      o.connect(g2); g2.connect(a.destination); o.start(t); o.stop(t+.62);
    }
  }catch(e){}
}
function bedStop(){
  if(!bed) return;
  try{ const t = bed.a.currentTime;
    bed.wind.g.gain.setTargetAtTime(0,t,.2); bed.carve.g.gain.setTargetAtTime(0,t,.2);
    bed.drone.g.gain.setTargetAtTime(0,t,.2);
  }catch(e){}
}

/* ══ the mountain ═════════════════════════════════════════════════════════
   The forest is not stored — it is a pure function of a cell index, so the
   world is infinite, deterministic and costs no memory. Only per-tree
   *fixation* is remembered (in FIX), because that lives in the player.     */
let SEED = 0;                                  // a fresh mountain every run
function rnd(i, j, s){
  let n = (i * 73856093) ^ (j * 19349663) ^ ((s + SEED*17) * 83492791);
  n = Math.imul(n ^ (n >>> 13), 1274126177); n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function vnoise(x, y, s){                      // smooth value noise, for glades vs. stands
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = rnd(xi,yi,s),   b = rnd(xi+1,yi,s);
  const c = rnd(xi,yi+1,s), d = rnd(xi+1,yi+1,s);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}
/* The mountain actually descends: height falls away down the fall line at the
   run's mean pitch, with rollers on top. The rolls are not decoration — a
   planar slope is nearly unreadable from eye height (past a few metres the
   whole thing compresses into ~8° of angular range, which is exactly why steep
   skiing feels blind), so the terrain has to pitch over and bench out the way
   real terrain does. Steep rolls hide what is beyond them; benches open up.  */
const R1A = 5.6, R1K = 0.0419, R2A = 0.95, R2K = 0.1013;
/* Cross-slope shape. Without an x-term the mountain is an extruded profile,
   and an extruded profile can only ever paint HORIZONTAL structure: every
   iso-distance contour is a level line on screen, the treeline's bottom edge
   is ruler-straight, and the eye reads those stacked bands as a flat lake
   with trees on the far shore — at which point every tree whose base sits
   above the lowest band "floats". No amount of removing drawn lines fixes
   that while the terrain itself keeps generating them. Diagonal rolls (both
   x and z in each phase) mean no contour is parallel to the screen edge. */
const X1A = 2.3, X1KX = 0.030, X1KZ = 0.011;
const X2A = 0.9, X2KX = 0.081, X2KZ = 0.026;
function surfY(x, z){                               // world height of the snow
  return -z*TANS + R1A*Math.sin(z*R1K) + R2A*Math.sin(z*R2K + 1.7)
       + X1A*Math.sin(x*X1KX + z*X1KZ + 0.9)
       + X2A*Math.sin(x*X2KX - z*X2KZ + 3.4);
}
function surfTan(x, z){                             // down-slope fall per metre
  return Math.max(0.05,
    TANS - (R1A*R1K*Math.cos(z*R1K) + R2A*R2K*Math.cos(z*R2K + 1.7)
          + X1A*X1KZ*Math.cos(x*X1KX + z*X1KZ + 0.9)
          - X2A*X2KZ*Math.cos(x*X2KX - z*X2KZ + 3.4)));
}

let SP = 9.5;       // grid spacing (m) — set by difficulty
let PDENS = 0.70;   // base chance a cell holds a tree
let ROCKP = 0.13;      // chance a treeless cell holds a boulder instead
let CHUTE = false;     // couloir mode: rock walls instead of a forest

/* The couloir. A centre line that wanders, and a half-width that breathes —
   opening into bowls, pinching into chokes you have to be lined up for well
   before you arrive. Both are pure functions of z, so the chute is as
   deterministic and as infinite as the forest is. */
function chuteX(z){
  return 26*Math.sin(z*0.0062) + 11*Math.sin(z*0.0171 + 2.2);
}
function chuteHW(z){                                  // half-width, metres
  const breathe = Math.sin(z*0.0125 + 1.1)*0.5 + Math.sin(z*0.0339)*0.32;
  return clamp(5.6 + 3.6*breathe, 2.8, 9.4);          // a slot, not a trench
}
// Height of the rock face above the snow at this point along the wall. Jagged,
// so the rim reads as a broken skyline rather than a fence.
function chuteWallH(z, side){
  /* Kept deliberately low-frequency. Fine detail here does not survive: the
     sweep samples geometrically, so far along the wall the step between samples
     is many metres and any short-wavelength term aliases into torn-paper
     spikes along the rim. */
  /* Tall enough to run clean off the top of the frame. In a real couloir you
     never see the tops of the walls from inside it — they just go up, and that
     is most of why a slot feels like a slot. */
  const k = side > 0 ? 3.1 : 7.9;
  return 34 + 13*Math.sin(z*0.031 + k) + 7*Math.sin(z*0.079 + k*2.3)
            + 4*Math.sin(z*0.148 + k*3.7);   // ~42m: breaks the smooth sail edge
}
let SLOPE = 0.54;      // mean pitch of the run (rad)
let TANS  = Math.tan(SLOPE);
// How much steeper than the line to the spot you are watching. Gaze parallel
// to the snow shows nothing, so this is what puts the slope in the frame — and
// it is the knob that sets how much the run reads as steep.
const EXCESS = 0.20;

// Tree for cell (i,j), or null. Deterministic. `soft` = a buried sapling you
// can blow through; it costs speed and composure but not the run.
/* A boulder. Low and wide where a tree is tall and thin, so it reads as a
   different kind of thing at a glance, and it reuses every field the trees
   already have (h, cr, tr) so gathering, projection, occlusion and collision
   all work on it unchanged. */
function rockAt(i, j, z0){
  const r2 = rnd(i,j,12), r3 = rnd(i,j,13);
  const rr = 0.62 + 1.25*r2*r2;                             // half-width, metres
  return {
    key: i + ',' + j,
    x: i*SP + (rnd(i,j,14) - .5) * SP * 0.8,
    z: z0   + (rnd(i,j,15) - .5) * SP * 0.8,
    rock: true,
    h:  rr * (0.55 + 0.5*r3),                               // squat: wider than tall
    cr: rr,
    tr: rr * 0.68,                                          // collision half-width
    tint: rnd(i,j,16)
  };
}

/* One cell of a couloir. Outside the corridor it is solid rock, packed tight
   enough to be a wall you cannot slip through; the band nearest the edge is
   the biggest and is the only rock in the game that PULLS on the gaze, because
   in a chute the wall beside you is exactly what catches your eye. Inside is
   mostly open — the odd boulder to break up the fall line, and the occasional
   scrubby tree clinging to the edge. */
function chuteAt(i, j, z0){
  const x0 = i*SP;
  const cx = chuteX(z0), hw = chuteHW(z0);
  const off = Math.abs(x0 - cx) - hw;               // <0 inside, >0 into the wall

  /* Nothing at the foot of the wall. Boulders there read as floating: they sit
     against a swept cliff face that has no contact shadow of its own, so they
     never look bedded in. The wall is the wall — drawn by drawChuteWalls,
     enforced by the corridor boundary, and it carries the gaze pull itself
     (see the wall magnet in the eye update) rather than needing rocks to do
     it. */
  if(off > -1.2) return null;

  // inside the corridor
  const r = rnd(i,j,27);
  if(r < 0.020) return rockAt(i, j, z0);             // a boulder mid-chute
  if(r < 0.032){                                     // scrub clinging on
    const h = 1.0 + 1.6*rnd(i,j,28);
    return { key:i+','+j, x:x0+(rnd(i,j,29)-.5)*SP*0.8, z:z0+(rnd(i,j,30)-.5)*SP*0.8,
             h, soft:true, cr:h*0.42, tr:0.10, tint:rnd(i,j,31) };
  }
  return null;
}

function treeAt(i, j){
  const z0 = j * SP;
  if(CHUTE) return chuteAt(i, j, z0);
  const dens = vnoise(i*0.115, j*0.085, 7);
  const ramp = Math.min(Math.max(z0,0) / 6000, 0.22);       // the woods tighten as you drop
  const open = clamp((z0 - 9) / 26, 0, 1);                  // an open apron to drop into
  const p = PDENS * (1 + ramp) * (0.30 + 1.35*dens) * open;
  if(rnd(i,j,1) >= p){
    /* Nothing grew here — so maybe a boulder did. Rocks deliberately occupy
       the GAPS, which is where you aim, and unlike a trunk they exert no pull
       on the gaze at all. That makes them the opposite hazard to a tree: trees
       punish looking at them, rocks punish not reading the gap you picked. */
    if(rnd(i,j,11) < ROCKP * open) return rockAt(i, j, z0);
    return null;
  }
  const r2 = rnd(i,j,2), r3 = rnd(i,j,3), r4 = rnd(i,j,4);
  const soft = r2 < 0.17;
  const h  = soft ? 1.1 + 1.7*r3 : 5.5 + 13.5*Math.pow(r3, 1.35);
  return {
    key: i + ',' + j,
    x: i*SP + (r4 - .5) * SP * 0.78,
    z: z0   + (rnd(i,j,5) - .5) * SP * 0.78,
    h, soft,
    cr: soft ? h*0.42 : h*0.185,                              // crown radius
    tr: soft ? 0.10   : 0.11 + h*0.027,                       // trunk radius
    tint: rnd(i,j,6)
  };
}
const FIX = new Map();          // cell key → how hard you're staring at it (0..1)
function fixOf(k){ return FIX.get(k) || 0; }

/* ══ difficulty ═══════════════════════════════════════════════════════════
   Tuned headlessly against a scripted gap-seeking rider (a crude but honest
   player): median run of ~740 m / ~440 m / ~280 m. Speed is the sharpest
   lever — in powder a faster board simply cannot make a tighter turn.       */
const DIFFS = {
  mellow: { name:'Mellow Glades', desc:'Room to breathe. Gentle pull.',
            sp:12.6, p:.60, vmax:19, fix:.62, flakes:70,  slope:23 },
  glades: { name:'The Glades',    desc:'Real tree riding.',
            sp:9.5,  p:.70, vmax:23, fix:1.0, flakes:110, slope:31 },
  steep:  { name:'Steep & Deep',  desc:'Tight, fast, and it stares back.',
            sp:8.3,  p:.58, vmax:26, fix:1.35, flakes:170, slope:39 },
  /* A couloir: rock walls either side, no forest to speak of. The grid is much
     finer because a wall has to be near-continuous, and the walls themselves
     carry the gaze pull — in a chute the thing that catches your eye is the
     rock beside you, so the one idea survives with nothing to change. */
  chute:  { name:'The Chute',     desc:'Rock either side. Nowhere to go but down.',
            sp:4.2,  p:.05, vmax:29, fix:1.5, flakes:150, slope:44, chute:true }
};
let diffKey = 'glades';

/* ══ state ════════════════════════════════════════════════════════════════ */
let mode = 'menu';                            // menu | ride | wreck | over
let showIntent = true;
let ride = 'board';                           // board | skis — cosmetic only
let S = null, cam = null, best = 0;
const mouse = { x: W/2, y: H*0.60, on:false };

function newRun(){
  const d = DIFFS[diffKey];
  SP = d.sp; PDENS = d.p; CHUTE = !!d.chute;
  SLOPE = d.slope * Math.PI/180;
  TANS = Math.tan(SLOPE);
  SEED = (Math.random() * 99991) | 0;
  const eyeY0 = H*0.62;              // settles onto the fall line within a frame or two
  FIX.clear();
  S = {
    d,
    x: CHUTE ? chuteX(0) : 0,   // drop in on the fall line, not into the wall
    z: 0, yaw: 0, v: 7, turn: 0,
    eye:{ x: W/2, y: eyeY0, vx: 0, vy: 0 },
    dist: 0, score: 0, flow: .25, calls: 0, topV: 0, fix: 0, fixTree: null,
    shake: 0, wreckT: 0, t: 0, bob: 0, flash: 0, drawDist: 138, lookDown: 0,
    pops: [], spray: [], flakes: [], hitKeys: new Set()
  };
  for(let i=0;i<d.flakes;i++) S.flakes.push({
    x:(Math.random()-.5)*36, y:(Math.random()-.5)*20, z: 1 + Math.random()*34,
    r: .5 + Math.random()*1.3
  });
  const p0 = Math.atan(TANS) + EXCESS;
  cam = { x:0, y:0, z:0, yaw:0, sy:0, cy:1, hz:HZ0, roll:0, rollY:H*0.4,
          pitch:p0, sp:Math.sin(p0), cp:Math.cos(p0), sky:undefined };
  mouse.x = W/2; mouse.y = eyeY0;
  // Leave the camera complete, never half-built: skyMed and the silhouette are
  // only produced by updateCamera, and render() needs both. Priming here means
  // a render can never arrive ahead of the first update, whatever the caller.
  updateCamera(0);
  gatherVisible();
}

/* ══ input ════════════════════════════════════════════════════════════════ */
function toStage(e){
  const r = CV.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return { x: (p.clientX - r.left) / r.width * W, y: (p.clientY - r.top) / r.height * H };
}
CV.addEventListener('mousemove', e => { const p = toStage(e); mouse.x=p.x; mouse.y=p.y; mouse.on=true; });
CV.addEventListener('mouseleave', () => { mouse.on = false; });
CV.addEventListener('touchmove', e => { e.preventDefault(); const p=toStage(e); mouse.x=p.x; mouse.y=p.y; mouse.on=true; }, {passive:false});
CV.addEventListener('touchstart', e => { const p=toStage(e); mouse.x=p.x; mouse.y=p.y; mouse.on=true; });

document.getElementById('sndBtn').addEventListener('click', e => {
  sound = !sound; e.currentTarget.classList.toggle('on', sound);
  if(!sound) bedSet(0,0,0);
});
document.getElementById('intentBtn').addEventListener('click', e => {
  showIntent = !showIntent; e.currentTarget.classList.toggle('on', showIntent);
});
const rideBtn = document.getElementById('rideBtn');
function setRide(r){
